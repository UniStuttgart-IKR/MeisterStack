# Standalone agent and CLI fixture, with no controller group.
# The single-node profile grants local socket access to configured operators.
schema = 2

[fleet]
name = "single-node"

[defaults]
ssh = { user = "root", port = 22 }
# Use existing labelled filesystems; no installation layout is declared.
profiles = ["base", "adopted", "single-node"]
rollout = { max_unavailable = 1, reboot = "approve" }
# Standalone readiness checks the agent service and socket, not a controller session.
checks = { required = ["units", "session"] }

[[host]]
id = "rig"
name = "rig"
deployment = "nixos"
roles = ["agent"]
site = "desk"
failure_domain = "desk"
networks.management = { address = "10.0.0.20", prefix = 24, interface = "eth0", gateway = "10.0.0.1", static = true }
capabilities = ["kvm"]
