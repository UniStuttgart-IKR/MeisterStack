#
# Schema 2 evaluation fixture: one combined controller and two compute hosts.
# An operator deployment uses its own repository and inventory.

schema = 2

[fleet]
name = "one-box"
domain = "lab.example"

[defaults]
ssh = { user = "root", port = 22 }
profiles = ["base"]
rollout = { max_unavailable = 1, reboot = "approve" }
checks = { required = ["units", "session"] }

# Single-member etcd group.
[[group]]
id = "box"
kind = "raft"
profiles = ["controller"]

# Compute hosts share a canary class.
[[group]]
id = "compute"
kind = "compute"
profiles = ["compute-cpu"]
rollout = { canary = "compute-cpu" }

[[host]]
id = "box"
name = "box"
deployment = "nixos"
roles = ["cloud", "cluster", "agent", "addons"]
groups = ["box"]
site = "ikr-lab"
failure_domain = "rack1"
# static = true requests interface configuration; otherwise the address is descriptive.
networks.management = { address = "10.0.0.10", prefix = 24, interface = "eth0", gateway = "10.0.0.1", static = true }
install = { disk = { serial = "MEISTERBOX0001", size_gb = 960 }, layout = "disko/single-nvme.nix", preserve = ["/var/lib/meister-data"] }
persistence = [{ path = "/var/lib/meister-data", device = "label:meister-data", required = true }]
# Host modules are resolved relative to this inventory.
modules = ["hw/box.nix"]
hardware = { cpu = "AMD Ryzen 7 3800X", memory_gb = 32 }
capabilities = ["kvm"]

[[host]]
id = "n1"
name = "n1"
deployment = "nixos"
roles = ["agent"]
groups = ["compute"]
# Derive controller addresses from this group.
controller_group = "box"
site = "ikr-lab"
failure_domain = "rack1"
networks.management = { address = "10.0.0.11", prefix = 24, interface = "eth0", gateway = "10.0.0.1", static = true }
install = { disk = { serial = "MEISTERN10001", size_gb = 480 }, layout = "disko/single-nvme.nix", preserve = [] }
modules = ["hw/n1.nix"]
capabilities = ["kvm"]

[[host]]
id = "n2"
name = "n2"
deployment = "nixos"
roles = ["agent"]
groups = ["compute"]
controller_group = "box"
site = "ikr-lab"
failure_domain = "rack2"
networks.management = { address = "10.0.0.12", prefix = 24, interface = "eth0", gateway = "10.0.0.1", static = true }
# Exercise provider-supplied kernel/initrd boot with a layout without an ESP.
boot = "direct"
install = { disk = { serial = "MEISTERN20001", size_gb = 480 }, layout = "disko/single-direct.nix", preserve = [] }
modules = ["hw/n2.nix"]
capabilities = ["kvm"]

# Optional external observability endpoint; this fleet does not deploy it.
[[service]]
id = "observability-external"
kind = "observability"
managed = false
required = false
endpoint = { loki = "http://10.0.5.10:3100/loki/api/v1/push" }
