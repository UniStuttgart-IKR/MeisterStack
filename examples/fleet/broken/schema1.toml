# The pre-v1 plan. It has nodes instead of hosts, no groups, no deployment and
# no install — `meister-deploy legacy` reads it, and this flake says so
# instead of listing thirty missing keys.
[fleet]
name = "old"

[[node]]
name = "box"
address = "10.5.0.10"
roles = ["cloud", "cluster", "agent"]
disk = "/dev/vda"
