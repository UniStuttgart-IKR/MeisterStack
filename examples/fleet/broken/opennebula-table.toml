#
# A schema 2 inventory that still carries the pre-v1 `[opennebula]` table.
# The table was parsed and exported by both readers before v1 and read by
# nothing at all (M0 §4b); the provider lives in the lab repository now. So
# both readers refuse it by name rather than ignoring it, because an
# inventory that quietly drops a table is an inventory whose diff lies.
schema = 2

[fleet]
name = "old-lab"
domain = "lab"

[opennebula]
frontend = "10.0.8.21"
image = "MeisterStackObs"

[[host]]
id = "box"
name = "box"
deployment = "nixos"
roles = ["cloud", "cluster"]
networks.management = { address = "10.5.0.10", prefix = 24 }
