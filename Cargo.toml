[workspace]
resolver = "2"
members = [
	"shared/*",
	"components/*",
	"drivers/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = [ "Silas Müller <st187141@stud.uni-stuttgart.de>" ]

[workspace.dependencies]

# CLI
clap = { version = "4", features = ["derive"] }

# Async
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = "0.1.18"
async-trait = "0.1.89"

# gRPC sessions use rustls with the ring provider.
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost-build = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Derive API schemas from the serialized resource types.
schemars = { version = "1", features = ["chrono04"] }

# Error Handling
anyhow = "1"
thiserror = "2"

# Persistent data
redb = "4.1.0"
etcd-client = "0.19.0"

# REST transport; controllers use Hyper directly to inspect TLS peer certificates.
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
axum = { version = "0.8" }
# Bridge Hyper connections to Axum routers.
tower = { version = "0.5", features = ["util"] }

# Isolated temporary files for tests.
tempfile = "3"

# Utils
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
bytes = { version = "1", default-features = false }
futures = "0.3"
toml = "1.1"

# TLS and PKI share the ring provider.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
# CSR signing and PEM output.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
# Certificate parsing and signature verification.
x509-parser = { version = "0.18", features = ["verify"] }
sha2 = "0.10"
# JWT/JWK encoding and signature verification.
base64 = "0.22"
ring = "0.17"
# Public roots for OIDC provider connections; controller APIs use an explicit CA.
webpki-roots = "1"
# Time representation used for certificate validity.
time = { version = "0.3", default-features = false }

# networking
rtnetlink = "0.21"

# telemetry
tracing = "0.1"
# Text and JSON logs with runtime filtering.
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.33"
# Prometheus text exposition; process and protobuf collectors are disabled.
prometheus = { version = "0.14", default-features = false }

# Unix users, process control and descriptor passing (SCM_RIGHTS).
nix = { version = "0.31", features = ["fs", "zerocopy", "ioctl", "process", "signal", "resource", "socket", "term", "user"] }
libc = "0.2"
