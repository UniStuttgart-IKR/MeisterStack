<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>

  <rect width="1000" height="690" fill="#FFFFFF"/>

  <!-- ===== Cloud-Ebene ===== -->
  <rect x="40" y="30" width="920" height="140" rx="6" fill="#FFF8E7" stroke="#D6B656"/>
  <text x="54" y="52" font-size="14" font-weight="bold" fill="#7A5C00">Cloud tier</text>

  <rect x="80" y="85" width="140" height="50" rx="8" fill="#E1D5E7" stroke="#9673A6"/>
  <text x="150" y="115" font-size="14" font-weight="bold" text-anchor="middle">CLI</text>

  <rect x="380" y="75" width="200" height="70" rx="8" fill="#DAE8FC" stroke="#6C8EBF"/>
  <text x="480" y="115" font-size="15" font-weight="bold" text-anchor="middle">Cloud controller</text>

  <path d="M680,88 a50,8 0 0,1 100,0 v44 a50,8 0 0,1 -100,0 z" fill="#F5F5F5" stroke="#666666"/>
  <path d="M680,88 a50,8 0 0,0 100,0" fill="none" stroke="#666666"/>
  <text x="730" y="120" font-size="13" font-weight="bold" text-anchor="middle">etcd</text>

  <rect x="810" y="85" width="120" height="50" rx="8" fill="#FFFFFF" stroke="#999999" stroke-dasharray="5 4"/>
  <text x="870" y="110" font-size="13" font-weight="bold" text-anchor="middle">OIDC provider</text>
  <text x="870" y="126" font-size="10" fill="#555555" text-anchor="middle">optional</text>

  <!-- Kanten Cloud-Ebene -->
  <line x1="220" y1="110" x2="378" y2="110" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="280" y="96" width="42" height="16" fill="#FFF8E7"/>
  <text x="301" y="108" font-size="12" font-weight="bold" text-anchor="middle" fill="#333333">REST</text>
  <line x1="580" y1="110" x2="680" y2="110" stroke="#888888" stroke-dasharray="5 4"/>
  <path d="M580,135 Q720,168 870,135" fill="none" stroke="#888888" stroke-dasharray="5 4"/>

  <!-- ===== Cluster (gestapelt) ===== -->
  <rect x="52" y="242" width="920" height="420" rx="8" fill="#FFFFFF" stroke="#6C8EBF" stroke-dasharray="6 4"/>
  <rect x="40" y="230" width="920" height="420" rx="8" fill="#F4F7FC" stroke="#6C8EBF"/>
  <text x="54" y="252" font-size="14" font-weight="bold" fill="#2E4A7A">Cluster</text>

  <path d="M90,298 a50,8 0 0,1 100,0 v44 a50,8 0 0,1 -100,0 z" fill="#F5F5F5" stroke="#666666"/>
  <path d="M90,298 a50,8 0 0,0 100,0" fill="none" stroke="#666666"/>
  <text x="140" y="330" font-size="13" font-weight="bold" text-anchor="middle">etcd</text>

  <rect x="300" y="280" width="220" height="80" rx="8" fill="#DAE8FC" stroke="#6C8EBF"/>
  <text x="410" y="316" font-size="15" font-weight="bold" text-anchor="middle">Cluster controller</text>
  <text x="410" y="338" font-size="11" fill="#555555" text-anchor="middle">Scheduling, placement</text>

  <!-- Kanten Cluster: the cluster dials the cloud -->
  <line x1="442" y1="278" x2="480" y2="147" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="486" y="190" width="110" height="16" fill="#FFFFFF"/>
  <text x="490" y="202" font-size="12" font-weight="bold" fill="#333333">gRPC · dials up · n:1</text>
  <line x1="190" y1="320" x2="300" y2="320" stroke="#888888" stroke-dasharray="5 4"/>

  <!-- ===== Node (gestapelt) ===== -->
  <rect x="252" y="452" width="300" height="170" rx="8" fill="#FFFFFF" stroke="#82B366" stroke-dasharray="6 4"/>
  <rect x="240" y="440" width="300" height="170" rx="8" fill="#F3F9F1" stroke="#82B366"/>
  <text x="252" y="460" font-size="13" font-weight="bold" fill="#3D6B2B">Node</text>

  <path d="M260,503 a40,8 0 0,1 80,0 v49 a40,8 0 0,1 -80,0 z" fill="#F5F5F5" stroke="#666666"/>
  <path d="M260,503 a40,8 0 0,0 80,0" fill="none" stroke="#666666"/>
  <text x="300" y="538" font-size="13" font-weight="bold" text-anchor="middle">redb</text>

  <rect x="370" y="490" width="150" height="75" rx="8" fill="#D5E8D4" stroke="#82B366"/>
  <text x="445" y="524" font-size="15" font-weight="bold" text-anchor="middle">Agent</text>
  <text x="445" y="545" font-size="11" fill="#555555" text-anchor="middle">Driver traits</text>

  <rect x="640" y="440" width="290" height="175" rx="6" fill="none" stroke="#D6B656" stroke-dasharray="6 4"/>
  <text x="652" y="458" font-size="12" font-weight="bold" fill="#7A5C00">Drivers</text>
  <rect x="655" y="475" width="125" height="55" rx="8" fill="#FFF2CC" stroke="#D6B656"/>
  <text x="717" y="507" font-size="13" font-weight="bold" text-anchor="middle">Hypervisor</text>
  <rect x="790" y="475" width="125" height="55" rx="8" fill="#FFF2CC" stroke="#D6B656"/>
  <text x="852" y="507" font-size="13" font-weight="bold" text-anchor="middle">Network</text>
  <rect x="655" y="545" width="125" height="55" rx="8" fill="#FFF2CC" stroke="#D6B656"/>
  <text x="717" y="577" font-size="13" font-weight="bold" text-anchor="middle">Storage</text>
  <rect x="790" y="545" width="125" height="55" rx="8" fill="#FFF2CC" stroke="#D6B656"/>
  <text x="852" y="577" font-size="13" font-weight="bold" text-anchor="middle">Devices</text>

  <!-- Kanten Node -->
  <line x1="444" y1="488" x2="410" y2="362" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="436" y="400" width="110" height="16" fill="#F4F7FC"/>
  <text x="440" y="412" font-size="12" font-weight="bold" fill="#333333">gRPC · dials up · n:1</text>
  <line x1="340" y1="527" x2="370" y2="527" stroke="#888888" stroke-dasharray="5 4"/>
  <line x1="522" y1="527" x2="638" y2="527" stroke="#555555" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="558" y="509" width="46" height="14" fill="#F4F7FC"/>
  <text x="581" y="520" font-size="12" text-anchor="middle" fill="#333333">Drivers</text>
</svg>