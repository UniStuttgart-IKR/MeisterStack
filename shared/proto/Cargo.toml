# Generated session messages and shared transport configuration.
[package]
name = "meister-proto"
version = "0.1.0"
edition = "2024"

[dependencies]
tonic = { workspace = true }
prost = { workspace = true }
# Generated codecs refer to tonic_prost directly.
tonic-prost = { workspace = true }
anyhow = { workspace = true }
# client_tls installs the process-wide crypto provider required by tonic.
rustls = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }
