syntax = "proto3";

package meisterstack.v1;

message VmSpec {
  uint32 vcpus = 1;
  uint64 memory_mib = 2;
  oneof boot {
    DirectKernelBoot direct_kernel = 3;
    FirmwareBoot firmware = 4;
  }
  repeated VolumeSpec volumes = 5;
  repeated NicSpec nics = 6;
  repeated DeviceSpec devices = 7;
}

message DirectKernelBoot {
  string kernel = 1;
  string cmdline = 2;
  string initramfs = 3;
}

message FirmwareBoot {
  string firmware = 1;
}

message VolumeSpec {
  string id = 1;
  string base_image = 2;
  uint64 size_bytes = 3;
}

message NicSpec {
  string id = 1;
  string bridge = 2;
  string mac = 3;
}

message DeviceSpec {
  string id = 1;
  string driver_name = 2;
  string partition = 3;
  string params_json = 4;
}

service ControlPlane {
  rpc Session(stream AgentMessage) returns (stream ControllerMessage);
}

message AgentMessage {
  oneof kind {
    Hello hello = 1;
    CommandResult result = 2;
    StatusReport status = 3;
    ConsoleOpened console_opened = 4;
    ConsoleData console_output = 5;
    ConsoleClose console_close = 6;
  }
}
// Interactive consoles share the command session. ConsoleOpen, data and close
// messages use one session_id. A dropped transport ends the console. Agents
// use bounded output buffers.

message ConsoleOpen {
  string session_id = 1;
  // VM name on cloud-to-cluster requests; VM UID on cluster-to-agent requests.
  string vm_id = 2;
}

// Whether the line was given. `error` empty means it was.
message ConsoleOpened {
  string session_id = 1;
  string error = 2;
}

// Bytes, in whichever direction this message is travelling. Deliberately not
// lines: a console is a byte stream, and a tier that waited for a newline
// would hide a prompt that does not end in one.
message ConsoleData {
  string session_id = 1;
  bytes data = 2;
}

// Give the line back, or say that it is gone. Sent by either end; the sender
// stops using the session_id immediately afterwards.
message ConsoleClose {
  string session_id = 1;
  string reason = 2;
}


message Hello {
  string node_id = 1;
  string agent_version = 2;
  // What this node can host: the agent's configured device drivers and the
  // profiles each of them resolves. The controller keeps them as the node's
  // capacity so scheduling can look at them without asking the agent.
  repeated DriverInfo drivers = 3;
  // Machine profile for migration compatibility. Absent means unreported;
  // legacy silence does not itself refuse migration.
  MachineProfile machine = 4;
}

// Machine properties for migration compatibility checks, reported at Hello.
// Missing fields provide no evidence. Controllers compare CPU properties and
// apply the nested-host restriction before opening a transfer.
message MachineProfile {
  // `/proc/cpuinfo` `vendor_id` — `GenuineIntel`, `AuthenticAMD`. The
  // coarsest difference there is, and the one no profile can paper over.
  string cpu_vendor = 1;
  // `/proc/cpuinfo` `model name`, verbatim. What an operator reads in the
  // refusal, and what tells two generations of one vendor apart.
  string cpu_model = 2;
  // Sorted, space-separated CPU flags, retained individually for diagnostics.
  string cpu_flags = 3;
  // Whether /proc/cpuinfo reports the hypervisor flag. Used by nested
  // migration compatibility checks.
  bool nested = 4;
  // Which hypervisor this node runs under, when it is nested — the DMI vendor
  // (`KVM`, `QEMU`, `VMware`). Empty on bare metal and empty when it cannot
  // be read.
  string hypervisor = 5;
  // Guest CPU profile used for migration compatibility, currently Host.
  string cpu_profile = 6;
  // What the hypervisor binary calls itself, e.g. `cloud-hypervisor v53.0`.
  // Two ends on two builds is its own reason a state does not restore.
  string hypervisor_version = 7;
  // Host kernel version for diagnostics; differences alone do not refuse migration.
  string kernel = 8;
  // Configured physical_host or DMI serial. Empty means unknown, common
  // for nested guests; it cannot establish that two nodes share a host.
  string host = 9;
}

message DriverInfo {
  string name = 1;
  repeated string profiles = 2;
  // Volume backend locality: node-local, shared or networked. Use one entry
  // per backend so each profile has its own locality. Empty means unknown or
  // not a volume driver; capability flattening still uses (name, profile).
  string locality = 3;
}

// Sent every few seconds and after every command the agent processed: it is
// both the heartbeat and the only path a VM phase takes upwards.
message StatusReport {
  NodeStatus node = 1;
  repeated VmStatusReport vms = 2;
  // Empty for every agent from before 6k.
  repeated RouterReport routers = 7;
  // Image observations. Absence establishes nothing unless images_complete
  // asserts that this report contains the full local inventory.
  repeated ImageStateReport images = 3;
  // Volume observations. Absence does not prove deletion: an unreadable or
  // not-yet-provisioned record may be omitted. Gone explicitly acknowledges
  // deprovisioning; readers must not infer it from a missing entry.
  repeated VolumeStateReport volumes = 4;
  // Snapshot inventory, independent of source-volume lifetime.
  repeated SnapshotStateReport snapshots = 5;
  // The agent is intentionally stopping. Controllers can mark it unavailable
  // without waiting for heartbeat expiry. This does not mean its guests stopped.
  // False leaves ordinary heartbeat handling in effect.
  bool stopping = 6;
  // Durable outcomes for outgoing migration attempts. MigrateOut acknowledges
  // initiation; these reports carry later evidence keyed by VM and attempt IDs.
  // An empty list or a timeout does not establish an outcome.
  repeated MigrationReport migrations = 8;
  // True only when images contains the complete local image inventory.
  // A missing name then establishes absence from that inventory. False means
  // unavailable or incomplete, including heartbeat-only and older reports;
  // readers must not infer file absence from it.
  bool images_complete = 9;
  // True only when vms contains the complete record inventory. A reader may
  // use absence to release a stale binding only with this flag. Unreadable
  // inventory and heartbeat-only reports must leave it false.
  bool vms_complete = 10;
}

// Durable evidence from either endpoint, bound to a VM and migration attempt.
// Sending: accepted transfer; Unknown: ownership unresolved; Gone: source process
// absent; StillHere: acknowledged transfer explicitly aborted; Receiving: prepared
// target; Arrived: target received the guest. Success requires Gone AND Arrived.
message MigrationReport {
  // The VM's uid, the same one CreateInstance and MigrateOut carry.
  string vm_id = 1;
  // Retained for both in-flight and terminal reports.
  string peer = 2;
  // `Sending` | `Unknown` | `Gone` | `StillHere` | `Receiving` | `Arrived`.
  string outcome = 3;
  // Abort or uncertainty details, if available.
  string message = 4;
  // Required for migration protocol v2. Empty legacy reports are not evidence.
  string migration_id = 5;
}

// One snapshot, as the node that took it sees it.
message SnapshotStateReport {
  // The uid the controller handed out on SnapshotVolume.
  string snapshot_id = 1;
  // Creating | Ready | Failed, spelled exactly as the control plane's
  // VolumeSnapshotPhase -- plus `Gone`, which is this message's own and has
  // no object phase, because an object that reaches it is deleted.
  string phase = 2;
  // Provider-reported location or identifier. Empty means unreported,
  // not deleted; controllers must not guess a backend path.
  string backend = 3;
  // How big the copy came out, in bytes as the node measured it.
  uint64 size_bytes = 4;
  string message = 5;
  // Snapshot reason string. Empty for Ready or legacy reporters.
  string reason = 6;
}

// One volume, as the node that was told to make it sees it.
message VolumeStateReport {
  // The uid the controller handed out on ProvisionVolume.
  string id = 1;
  // Provisioning | Ready | Failed | Gone. The first three are the control
  // plane's own VolumePhase spelled exactly; `Gone` is this message's own and
  // has no object phase, because an object that reaches it is deleted.
  string phase = 2;
  // Provider-reported location or identifier. Empty means unreported,
  // not deleted; controllers must not guess a backend path.
  string backend = 3;
  string message = 4;
  // Measured provider size, including backend rounding. Zero from legacy
  // reporters means unreported; do not substitute requested size as evidence.
  uint64 size_bytes = 5;
  // Bounded node reason from proto::reasons::VOLUME. Preserve unknown words
  // in diagnostic messages. An empty value supplies no reason.
  string reason = 6;
  // Whether local VM records still hold this volume, including records being
  // torn down. Keep the observation until detach completes. Do not derive it
  // from the reported VM list, which may omit VMs with desired Absent. Older
  // agents default this field to false, so absence of a claim needs care.
  bool open = 7;
}

message ImageStateReport {
  // The catalogue name, which is what the cloud's Image object is called.
  string name = 1;
  // One of the cloud's ImagePhase variants, spelled exactly: Ready, Failed.
  // A node never says Pending — an image it has no opinion about is simply
  // not in the list.
  string phase = 2;
  string message = 3;
  // Node associated with this image observation. Empty on the agent hop;
  // filled by the cluster for per-node aggregation at the cloud. An empty
  // cluster value is a legacy aggregate with no node-level evidence.
  string node = 4;
  // Image failure category, such as NotFound, NotAFile or FetchFailed.
  // Empty means no reason was supplied.
  string reason = 5;
  // SHA-256 of a path image after inspection. The cloud pins the first digest
  // and checks later observations against it. Empty supplies no evidence; URL
  // images already carry their expected checksum in spec.
  string digest = 6;
}

message NodeStatus {
  uint32 vcpus = 1;
  uint64 mem_mib = 2;
  // Reported health conditions that veto placement. Any nonempty list blocks
  // new work, including unknown condition names. Empty supplies no negative
  // condition; it does not certify checks omitted by an older agent.
  repeated NodeCondition conditions = 3;
}

// Node health condition with a stable reason and readable message.
message NodeCondition {
  // Known types include DiskPressure, StoreUnhealthy and CgroupUnusable.
  // Controllers treat every nonempty condition, including unknown types, as
  // a placement veto and retain the word for diagnosis.
  string type = 1;
  // The same fact in words, naming what would have to change.
  string message = 2;
}

message VmStatusReport {
  // The uuid the controller handed out as metadata.uid on CreateInstance.
  string id = 1;
  // One of the controller's VmPhase variants, spelled exactly.
  string phase = 2;
  string message = 3;
  // UIDs of referenced volumes actually attached to this VM. Inline disks
  // are omitted. Controllers compare this observation with desired references
  // before acknowledging hot-plug completion; command receipt is insufficient.
  repeated string attached_volumes = 4;
  // Actual node, filled by the cluster and empty on the agent hop. At the
  // cloud this updates observed node placement, not the desired binding.
  string node = 5;
  // Named attachment observations on the cluster-to-cloud hop. The cluster
  // resolves the agent's attached_volumes UIDs to Volume names. Empty on the
  // agent hop and from older cluster reports.
  repeated VolumeAttachment volumes = 6;
  // Bounded reason for the reported phase. Node and controller vocabularies
  // are shared through proto::reasons. Unknown words must survive in messages
  // so version skew remains visible. Empty supplies no reason.
  string reason = 7;
  // Tap MAC addresses reported by the node and relayed by the cluster.
  // These are not guest IP discovery. A nonempty list replaces known MAC
  // entries; empty lists leave them unchanged for older-peer compatibility.
  repeated NicReport nics = 8;
}

// One tap of a VM and the hardware address on it.
message NicReport {
  // Positional NIC field path, e.g. `nics[0]`; NIC specs have no separate names.
  string name = 1;
  // Lower case, colon-separated, as `MacAddr` prints it.
  string mac = 2;
}

// One referenced disk of a VM and whether the node has it open, as the tier
// that owns both objects names it.
message VolumeAttachment {
  // The NAME, because this is what a person reads. The uid is what travels
  // on the agent's road, and resolving the two is the cluster's job.
  string name = 1;
  // What the NODE said, not what it was told. False on a disk that was asked
  // for and has not arrived, which reads as "not confirmed" and never as
  // "detached".
  bool attached = 2;
}

message ControllerMessage {
  oneof kind {
    Command command = 1;
    SyncState sync = 2;
    ConsoleOpen console_open = 3;
    ConsoleData console_input = 4;
    ConsoleClose console_close = 5;
  }
}

// Complete managed VM intent sent after Hello. Entries reuse idempotent
// CreateInstance semantics. Missing managed records become Absent unless an
// incoming attempt protects them; operation barriers still gate teardown.
// Local VMs remain. Deleting controller objects are omitted and continue
// through the controller finalizer/Destroy path.
message SyncState {
  repeated CreateInstance desired = 1;
}

message Command {
  string request_id = 1;
  // W3C traceparent of the request this command descends from, so one trace
  // reaches from `POST /vms` through both gRPC hops into the driver spans.
  // Empty = no context; the node then starts its own rather than guessing.
  string traceparent = 8;
  oneof op {
    CreateInstance create = 2;
    DestroyInstance destroy = 3;
    StartInstance start = 4;
    StopInstance stop = 5;
    PauseInstance pause = 6;
    ResumeInstance resume = 7;
    FetchLogs logs = 9;
    ProvisionVolume provision_volume = 10;
    DeprovisionVolume deprovision_volume = 11;
    SnapshotVolume snapshot_volume = 12;
    DropSnapshot drop_snapshot = 13;
    ResizeVolume resize_volume = 14;
    ResizeAttachment resize_attachment = 15;
    PrepareMigration prepare_migration = 16;
    MigrateOut migrate_out = 17;
    // Idempotent router intent; the controller selects active placement and
    // translation while the node supplies the provider interface.
    EnsureRouter ensure_router = 18;
    DestroyRouter destroy_router = 19;
    // Let go of a volume's RECORD and keep the bytes. The one command in this
    // list that is a removal and destroys nothing; see ForgetVolume.
    ForgetVolume forget_volume = 20;
    // Told once, from the cloud, that an image was deleted. See DropImage.
    DropImage drop_image = 21;
    CleanupMigration cleanup_migration = 22;
  }
}

// Forget the local volume record and release per-node claims while preserving
// data. Refuse while a local VM still holds the volume. Repeating an already
// completed request succeeds. Do not emit a Gone tombstone: forgetting local
// bookkeeping is not evidence that backend bytes were deleted.
message ForgetVolume {
  // The Volume object's metadata.uid, exactly as ProvisionVolume carries it.
  string id = 1;
}

// Invalidate an image UID through both session tiers. Broadcast to connected
// peers; incomplete inventory must not suppress delivery. Remove a name link
// only when it still identifies this UID, preserving any newer registration.
message DropImage {
  // The catalogue name, so a node can tell whether ITS link under that name
  // still points at the uid being dropped before it removes the link too.
  string name = 1;
  // The Image object's metadata.uid.
  string uid = 2;
}

// Router joining a dedicated provider physnet and tenant VNI, with NAT
// and active-node prefix announcements. Interface addresses use CIDR notation.
message EnsureRouter {
  string id = 1;
  string physnet = 2;
  string external_addr = 3;
  string external_gateway = 4;
  uint32 vni = 5;
  string internal_addr = 6;
  repeated NatRule nats = 7;
  bool active = 8;
}

// Rule kind: snat, dnat_and_snat or routed. For snat, empty logical_ip means
// the full internal subnet. Routed carries a prefix in logical_ip and has no
// external_ip or address translation.
message NatRule {
  string kind = 1;
  string external_ip = 2;
  string logical_ip = 3;
}

message DestroyRouter {
  string id = 1;
}

// Observed router state. The ID identifies the commanding tier's object;
// cluster reports additionally carry placement fields.
message RouterReport {
  string id = 1;
  string phase = 2;
  string message = 3;
  bool active = 4;
  // Active node, filled by the cluster; empty on the agent hop. An empty
  // cluster value means no node is currently reported active.
  string node = 5;
  // Ordered cluster gateway placement, omitted by agents. Cloud mirrors
  // this evidence; one placement provides no standby.
  repeated string nodes = 6;
  // Bounded router failure reason, such as NetnsGone or FabricUnhealthy.
  // Unknown words must remain visible in the message; empty supplies no reason.
  string reason = 7;
}

// Prepare resources and a VMM listener for a migration attempt. Ack.payload
// returns JSON `{"peer": "tcp:<addr>:<port>"}`; intermediate tiers carry this
// address unchanged. Disks, taps and paths must match the transferred config.
// The receiving VMM must not already contain a created guest.
message PrepareMigration {
  // The VM's uid, the same one CreateInstance carries. It is the SAME vm: a
  // live migration moves a guest between machines and does not make a second
  // object anywhere.
  string id = 1;
  // The NewVmSpec as JSON, exactly as CreateInstance carries it. The same
  // document the source was given, so that the disks, taps and files this
  // node builds are the ones the arriving configuration will name.
  string spec_json = 2;
  // Optional receive listener address. Empty lets the node choose.
  string listen = 3;
  string migration_id = 4;
}

// Start sending the source guest to the prepared destination. Ack confirms
// acceptance only. Errors and lost replies do not prove an abort; retain
// attempt protection until matching durable evidence resolves ownership.
message MigrateOut {
  string id = 1;
  // The address the destination answered with, verbatim. Not parsed at any
  // tier between the two nodes: two machines agree on a string and nobody in
  // the middle needs to know what it means.
  string peer = 2;
  string migration_id = 3;
}

// Cleanup is conditional on durable attempt ownership. Never falls back to Destroy.
message CleanupMigration {
  string id = 1;
  string migration_id = 2;
  // True: remove the departed source. False: cancel the prepared destination.
  bool source = 3;
}

// Provision or recover the volume identified by id. Backend names must
// remain stable across retries after lost replies.
message ProvisionVolume {
  // The Volume object's metadata.uid, exactly as CreateInstance carries a
  // VM's: a name is what people call a volume and people reuse names, the
  // uid is which volume it is.
  string id = 1;
  // Resolved VolumeSpec JSON: driver, merged pool/volume params, size and
  // base image. Uses the same format as inline VM volume provisioning.
  string spec_json = 2;
  // Source snapshot UID, mutually exclusive with base-image fields.
  // Empty retains ordinary empty/image provisioning for legacy requests.
  string from_snapshot = 3;
}

// Snapshot on the volume's provisioning node, idempotently by snapshot_id.
// For NeedsQuiesce drivers, the cluster sequences guest pause and resume; the
// consumer may run on another node. Atomic drivers require no such pause.
message SnapshotVolume {
  // The Volume object's uid: which disk to copy.
  string id = 1;
  // The VolumeSnapshot object's uid: what the copy will be called.
  string snapshot_id = 2;
}

// Destroy a snapshot and its data. Idempotent: one that is already gone is
// answered `Gone`, exactly as a deprovisioned volume is, and for the same
// reason -- absence from a node's report is not proof of anything.
message DropSnapshot { string snapshot_id = 1; }

// Grow provider data idempotently, even without an attached VM.
// Guest notification through ResizeAttachment is a separate operation.
message ResizeVolume {
  // The Volume object's uid.
  string id = 1;
  // The new size in bytes. A multiple of the sector size by construction --
  // the object measures in GiB.
  uint64 size_bytes = 2;
}

// Notify the guest after backend growth, on the node running the VM. A failed
// notification does not undo the grown bytes. Reported size remains old until
// the guest-side operation completes.
message ResizeAttachment {
  // The Vm object's uid -- the id the node was handed on CreateInstance.
  string vm = 1;
  // The Volume object's uid, which is what the disk is named after on the
  // VMM side (`hypervisor::disk_id`).
  string volume_id = 2;
  uint64 size_bytes = 3;
}

// Delete the volume and its data, refusing while a local VM holds it.
// An already-absent local record returns Gone.
message DeprovisionVolume { string id = 1; }

// Fetch log bytes through the existing outbound session. The reply
// uses the correlated command Ack.payload.
message FetchLogs {
  string id = 1;
  // How many lines from the END. The node keeps a bounded ring per stream
  // and this only shortens what comes out of it; 0 = the node's default.
  uint32 lines = 2;
  // Substring filters applied on the node before the line limit. Any hide
  // match drops a line; nonempty only requires at least one match. Empty
  // filters retain all lines.
  repeated string hide = 3;
  repeated string only = 4;
  // Streams to read. Empty selects guest console/serial; VMM diagnostics
  // are returned only when explicitly requested.
  repeated string streams = 5;
}

message DestroyInstance { string id = 1; }

// Set desired runtime state and let agent reconciliation converge.
// Controllers repeat commands according to desired versus observed state.
message StartInstance { string id = 1; }

message StopInstance {
  string id = 1;
  // Grace period for the guest to power off before the vmm is killed.
  // Unset = the agent's configured default (stop_grace_secs).
  optional uint64 grace_secs = 2;
}

message PauseInstance { string id = 1; }
message ResumeInstance { string id = 1; }

message CommandResult {
  string request_id = 1;
  oneof outcome {
    Ack ok = 2;
    ErrorMsg error = 3;
  }
}

// Command acknowledgement with operation-specific optional payload.
// Its completion meaning belongs to the command contract; it is not
// a universal proof that the external side effect finished.
message Ack { bytes payload = 1; }
message ErrorMsg {
  string message = 1;
  // Typed refusal reason such as Unavailable, NotFound or Conflict.
  // Legacy peers may leave it empty; callers need a conservative fallback.
  string reason = 2;
}

message CreateInstance {
  string id = 1;
  VmSpec spec = 2;
  // NewVmSpec as JSON, verbatim what the agent's REST API accepts. When set
  // it wins over `spec`: one spec format everywhere, and driver/profile/
  // params travel without proto modelling.
  string spec_json = 3;
}

// Cluster-to-cloud bidirectional session: cluster status travels up,
// cloud assignments down. The tiers do not share their resource namespace.

service ClusterPlane {
  rpc Session(stream ClusterMessage) returns (stream CloudMessage);
}

message ClusterMessage {
  oneof kind {
    ClusterHello hello = 1;
    CommandResult result = 2;
    ClusterStatus status = 3;
    ConsoleOpened console_opened = 4;
    ConsoleData console_output = 5;
    ConsoleClose console_close = 6;
  }
}

message ClusterHello {
  string cluster_name = 1;
  string version = 2;
}

// Sent every ten seconds and right after every command the cluster processed:
// the heartbeat, the aggregate the cloud places against, and the only path a
// cloud-managed VM's phase takes upwards.
message ClusterStatus {
  uint32 nodes_ready = 1;
  uint32 nodes_total = 2;
  ClusterCapacity capacity = 3;
  // Cloud-owned VM inventory, including terminating objects. IDs are the
  // cloud-supplied UIDs; absence needs a complete, current report.
  repeated VmStatusReport vms = 4;
  // The union of what this cluster's nodes said about base images, the same
  // road one tier up. Failed wins over Ready where two nodes disagree: a
  // checksum that did not match is a fact about the bytes and not about the
  // node that read them.
  repeated ImageStateReport images = 6;
  // Whether the full managed VM inventory was read. False prohibits
  // interpreting missing entries as completed deletion.
  bool vms_complete = 5;
  // Cloud-owned volumes, including terminating objects, identified by
  // the UIDs supplied on CreateVolume.
  repeated VolumeStatusReport volumes = 8;
  // Completeness of cloud-managed volume objects held by this cluster.
  // Missing entries from an incomplete list do not establish deletion.
  bool volumes_complete = 9;
  // Cluster pool observations, including driver-reported locality used
  // by cloud placement. See StoragePoolStatusReport.
  repeated StoragePoolStatusReport pools = 10;
  // Node inventory for cloud visibility and placement filtering. Cloud
  // mirrors these observations; UpdateNode carries intent in the reverse direction.
  repeated NodeReport nodes = 7;
  // The volume snapshots this cluster holds for the cloud, the ones on their
  // way out included. Same road as `volumes`, one object over.
  repeated VolumeSnapshotStatusReport snapshots = 11;
  // The same statement `volumes_complete` makes, about this list.
  bool snapshots_complete = 12;
  // Cloud-managed router observations, including routers being deleted. IDs
  // are cloud UIDs. The cluster fills active node and candidate nodes so
  // gateway failover is visible at the cloud.
  repeated RouterReport routers = 14;
  // Completeness of cloud-managed router objects held by this cluster.
  // Record absence does not prove node cleanup has completed.
  bool routers_complete = 15;
  // Cloud-managed secret UIDs and generations held by the cluster. The cloud
  // avoids resending unchanged copies and removes mirrors absent upstream.
  repeated SecretStateReport secrets = 13;
}

// One mirrored secret, as the cluster holding it sees it.
message SecretStateReport {
  string name = 1;
  // The uid the CLOUD handed out on CreateSecret, which is what says WHICH
  // secret this is: a name is a label people reuse.
  string uid = 2;
  // Source cloud generation on the mirrored copy. Legacy zero causes
  // resending rather than claiming the current generation is present.
  uint64 generation = 3;
}

// One volume snapshot, as the cluster sees it. Evidence travelling upwards;
// the cloud mirrors these fields onto its own object and writes none of them.
message VolumeSnapshotStatusReport {
  string uid = 1;
  // One of the control plane's VolumeSnapshotPhase variants, spelled exactly.
  string phase = 2;
  // The node that took the copy. Empty until one has.
  string node = 3;
  // What the backend calls it. Empty until a node has said it, and empty
  // never means "gone" — the same "only ever arrives" rule the volume's
  // backend name travels under.
  string backend = 4;
  // How big the copy turned out to be, in GiB. Zero until measured.
  uint64 size_gib = 5;
  string message = 6;
  // Cluster snapshot reason, derived from node reports or reconciliation.
  // Legacy empty strings map to Unrecorded.
  string reason = 7;
}

// Cluster storage-pool observations mirrored into cloud pool status.
message StoragePoolStatusReport {
  string name = 1;
  // Pending | Ready | Failed — the cluster's StoragePoolPhase, spelled out.
  string phase = 2;
  // node-local | shared | networked. Empty means unknown and must not
  // be treated as evidence that data is pinned to one node.
  string locality = 3;
  // The nodes that can reach it, as the pool down there names them. Empty =
  // every node of that cluster, exactly as `StoragePoolSpec.nodes` means it.
  repeated string nodes = 4;
  string message = 5;
  // Cluster pool parameters as JSON, used to compare shared-backend
  // identity across clusters. Empty includes legacy reporters.
  string params_json = 6;
  // Pool reason supplied by the cluster; agents report driver capabilities
  // instead of pool objects. Distinguishes a missing pool from a silent peer.
  string reason = 7;
}

// One volume, as the cluster sees it. The cloud mirrors these fields onto its
// own object and writes none of them itself — evidence travelling upwards,
// exactly like every other field of ClusterStatus.
message VolumeStatusReport {
  string uid = 1;
  // One of the control plane's VolumePhase variants, spelled exactly.
  string phase = 2;
  // Volume owner node, empty while unplaced. Used for operator visibility
  // and node-local volume constraints in cloud placement.
  string node = 3;
  // The VM holding it, by name, inside that cluster. Empty = nobody.
  string attached_to = 4;
  string message = 5;
  // Node-reported backend identifier. Empty means unreported, not gone.
  string backend = 6;
  // Observed size in GiB after resize processing, independent of requested
  // spec.sizeGib. Zero means unmeasured or omitted by an older peer.
  uint64 size_gib = 7;
  // Nodes reporting this volume open. A migration can temporarily name two.
  // An empty list from an older cluster is not proof of closure.
  repeated string open_on = 8;
  // Volume reason mirrored from cluster state. Empty for Ready or legacy reporters.
  string reason = 9;
}

// Node intent and observations mirrored into cloud-side Node objects.
message NodeReport {
  string name = 1;
  // The agent has a session AND its heartbeat has not expired.
  bool ready = 2;
  // spec.schedulable: false cordons new placement without evicting existing VMs.
  bool schedulable = 3;
  // `spec.labels`, what a vm's nodeSelector selects against.
  map<string, string> labels = 4;
  // Node drain intent, mirrored for cloud-side observation.
  bool drain = 9;
  uint32 vcpus = 5;
  uint64 mem_mib = 6;
  // `<driver>/<profile>`, the node's device catalogue flattened — the same
  // spelling ClusterCapacity uses.
  repeated string capabilities = 7;
  // VMs the agent reported in its last status.
  uint32 vms = 8;
  // Node-reported health conditions used by both tiers for placement vetoes.
  repeated NodeCondition conditions = 10;
  // Observed drain progress, mirroring controller_api::Draining. Absent means
  // no reported drain; the spec drain flag remains the requested policy.
  DrainingReport draining = 11;
  // Accepted workload classes from NodeSpec. Empty accepts every class.
  // The cloud uses the same class predicate as cluster placement.
  repeated string accepts = 12;
  // Completeness of this node's image inventory, relayed separately per node.
  // False means unavailable or incomplete; absence then proves nothing. See
  // StatusReport.images_complete for the corresponding agent-hop contract.
  bool images_complete = 13;
  // What the VMs bound to this node ask for, as this cluster counts them,
  // cluster-local VMs included. The cloud measures one node's room with it, so
  // it binds a VM only to a cluster with a node that can take it. Zero from an
  // older cluster leaves the whole capacity as the room.
  uint32 bound_vcpus = 14;
  uint64 bound_mem_mib = 15;
}

// The evidence a drain leaves, relayed one tier up. See
// `controller_api::Draining`, whose fields these are.
message DrainingReport {
  // VMs still here and on their way off. A snapshot, not a total: a guest
  // that has arrived somewhere else is neither here nor leaving.
  uint32 leaving = 1;
  // The same thing by name, which is what says what a drain is waiting for.
  repeated string leaving_vms = 2;
  // How many this drain has got off the machine since it started. The total
  // `leaving` is not — a finished drain has zero leaving and may have moved
  // a machine's worth of guests.
  uint32 moved_total = 3;
  // VMs that are here and are not going.
  uint32 staying = 4;
  // Nothing is on its way any more. What is left is left. Derived where it
  // is written, so a dashboard and a script cannot disagree about when a
  // drain finished.
  bool complete = 5;
  // One entry per staying VM.
  repeated StayingVm reasons = 6;
}

// One VM a drain did not move, and why.
message StayingVm {
  string vm = 1;
  // One of `StayReason::as_str`, a closed set a client can branch on.
  string reason = 2;
  // The same thing in words, which names what would have to change. Both,
  // because asking a program to match on prose is asking it to break.
  string message = 3;
}

// The ready nodes' capacity, summed; capabilities is their union. Both are
// what this cluster can host at all, which is the granularity a decision one
// tier up can actually use — the node-exact fit is the cluster's own business.
message ClusterCapacity {
  uint32 vcpus = 1;
  uint64 mem_mib = 2;
  repeated string capabilities = 3;
}

message CloudMessage {
  oneof kind {
    CloudCommand command = 1;
    // The same four, one tier up. The cluster relays them to the node that
    // holds the VM; nothing about the shape changes on the way.
    ConsoleOpen console_open = 2;
    ConsoleData console_input = 3;
    ConsoleClose console_close = 4;
  }
}

message CloudCommand {
  string request_id = 1;
  // Same field, one tier up. See Command.traceparent.
  string traceparent = 4;
  oneof op {
    CreateVm create = 2;
    DestroyVm destroy = 3;
    FetchVmLogs logs = 5;
    UpdateNode update_node = 6;
    CreateVolume create_volume = 7;
    DestroyVolume destroy_volume = 8;
    CreateSecret create_secret = 9;
    DeleteSecret delete_secret = 10;
    CreateSnapshot create_snapshot = 11;
    DestroySnapshot destroy_snapshot = 12;
    ReleaseVolume release_volume = 13;
    CreateVmMigration create_vm_migration = 14;
    CreateRouter create_router = 15;
    DeleteRouter delete_router = 16;
    // An image was deleted; every connected cluster is told once. See
    // DropImage.
    DropImage drop_image = 17;
  }
}

// Create a tenant router from resolved tenant, provider-network and address
// objects. The cluster selects its gateway nodes. Repeated delivery with the
// same UID is idempotent; a different UID must not adopt an existing object.
message CreateRouter {
  // What the router is called. The tenant's name for it, the same one at
  // both tiers.
  string name = 1;
  // The cluster tier's RouterSpec as JSON. One spec format the whole way
  // down, exactly as CreateVm.spec_json is.
  string spec_json = 2;
  // The cloud object's metadata.uid, and the only thing a create adopts on.
  string uid = 3;
  // Provider-network name and JSON spec mirrored with the router so cluster
  // placement uses the cloud's network definition.
  string network_name = 4;
  string network_json = 5;
  // Cloud-allocated external CIDR. Allocation spans clusters, so the
  // receiving cluster retains this address instead of allocating independently.
  string external_addr = 6;
  // Cloud-resolved floating-IP and routed-subnet NAT rules. Cluster
  // reconciliation must retain them because it lacks those cloud objects.
  repeated NatRule nats = 7;
  // Resolved routed prefixes, also carried as routed NAT rules for the
  // node contract. This field supports placement/status presentation.
  repeated string announced = 8;
}

// Delete the cluster router record. Node sweeps clean up remaining namespaces;
// neither this ACK nor cluster inventory absence proves node cleanup completed.
message DeleteRouter {
  string name = 1;
  // Same rule as CreateRouter: only the object carrying this uid is ours to
  // stamp. A cluster-local router of the same name is acked untouched.
  string uid = 2;
}

// Request migration between nodes of the receiving cluster. The cluster owns
// destination selection and transfer sequencing; this message does not enable
// cross-cluster live migration. The client supplies the record name so the
// cloud can return it; repeated creation is handled idempotently by name.
message CreateVmMigration {
  // What the record is called at the cluster. `<vm>-<yyyymmdd>t<hhmmss>`, as
  // the CLI builds it.
  string name = 1;
  // The vm to move, by the name the cluster knows it under — which is the
  // name the cloud gave it, because a cluster's copy carries it.
  string vm = 2;
  // Where to. Empty = the cluster's scheduler chooses, which is what an
  // operator who did not say `--to` asked for.
  string target_node = 3;
  // Whose guest this is. Carried and not enforced at the cluster, the same
  // rule `CreateVm` follows: the cluster keeps no directory.
  string tenant = 4;
  // The cloud vm's uid. The cluster moves only the copy that carries it as
  // its cloud uid: a cluster-local vm of the same name is not the cloud's to
  // move. Empty, from a cloud older than the field, is refused.
  string vm_uid = 5;
}

// Release the cluster's volume object without deprovisioning backend data.
// Used when shared or networked storage changes cluster ownership. Guard by
// UID so a stale request cannot delete a replacement. Ack follows removal of
// the object; no node-side deletion is requested.
message ReleaseVolume {
  string name = 1;
  // Same rule as CreateVolume and DestroyVolume: only the object carrying
  // this uid is ours to let go of.
  string uid = 2;
}

// Create the cluster snapshot object idempotently by name and cloud
// UID. Placement follows the source volume; there is no independent
// snapshot scheduling decision in this message.
message CreateSnapshot {
  string name = 1;
  // The cluster tier's `VolumeSnapshotSpec` as JSON — one spec format the
  // whole way down. `spec.volume` names the volume by the name the cloud gave
  // it, which is the name the cluster's own copy carries.
  string spec_json = 2;
  // Cloud object incarnation. Adoption requires this exact UID, so name
  // reuse cannot take ownership of an unrelated object.
  string uid = 3;
  // Whose it is, resolved at the cloud because the Tenant object lives there.
  string tenant = 4;
}

// Mark the cluster snapshot for deletion. Its finalizer performs cleanup;
// cloud removal waits for cluster absence. DropSnapshot is the separate
// node command that removes backend data.
message DestroySnapshot {
  string name = 1;
  // Same rule as DestroyVolume: only the object carrying this uid is ours to
  // stamp. Anything else is acked untouched.
  string uid = 2;
}

// Create or adopt a cluster volume object by name and matching cloud
// UID. Cloud pool resolution chooses the cluster before sending this command.
message CreateVolume {
  string name = 1;
  // The cluster tier's `VolumeSpec` as JSON. One spec format the whole way
  // down, exactly as `CreateVm.spec_json` is.
  string spec_json = 2;
  // Cloud object incarnation. Adoption requires this exact UID, so name
  // reuse cannot take ownership of an unrelated object.
  string uid = 3;
  // Whose it is, resolved at the cloud because the Tenant object lives there.
  string tenant = 4;
}

// Set deletionTimestamp on the cluster volume. Its finalizer uses
// DeprovisionVolume for backend cleanup; cloud removal waits for cluster absence.
message DestroyVolume {
  string name = 1;
  // Same rule as CreateVolume: only the object carrying this uid is ours to
  // stamp. Anything else is acked untouched rather than deleted.
  string uid = 2;
}

// Mirror a sealed Secret spec to a cluster using the same KEK. The ciphertext
// remains sealed over this session. The cluster resolves cloud-init references
// before agent dispatch; a missing mirror keeps the dependent VM pending.
message CreateSecret {
  string name = 1;
  string spec_json = 2;
  // Cloud secret generation, persisted as mirror metadata and reported
  // back so unchanged secrets need not be resent.
  uint64 generation = 5;
  // Same rule as CreateVolume: a name is a label people reuse, and only the
  // object carrying this uid is ours to overwrite.
  string uid = 3;
  string tenant = 4;
}

// Removes the mirrored object. Not a finalizer flow and deliberately not one:
// nothing at the cluster OWNS bytes on behalf of a secret the way a volume
// owns a disk, so there is nothing to tear down and nothing to wait for.
message DeleteSecret {
  string name = 1;
  string uid = 2;
}

// Node intent forwarded from cloud to the cluster's ordinary update
// path. Cloud node copies remain report-derived observations.
message UpdateNode {
  string name = 1;
  // Unset = leave the cordon as it is. Set = this is what it becomes.
  optional bool schedulable = 2;
  // Unset preserves drain state. Drain and schedulable are independent:
  // clearing drain must retain the operator's cordon choice.
  optional bool drain = 5;
  // Labels to set, replacing a key that is already there.
  map<string, string> labels = 3;
  // Labels to take off, applied after `labels` — so naming a key in both
  // means it goes, the same rule `meister node label --rm` has always had.
  repeated string remove_labels = 4;
  // Optional update of NodeSpec.accepts. A submessage distinguishes no update
  // from an explicit empty list, which removes class restrictions.
  AcceptsUpdate accepts = 6;
}

// Workload-class acceptance update. Wrapper presence distinguishes no
// change from an explicitly empty acceptance list.
message AcceptsUpdate {
  // Empty = this machine takes everything again, which is what every machine
  // that was never told otherwise does.
  repeated string classes = 1;
}

message FetchVmLogs {
  string name = 1;
  // Same rule as CreateVm and DestroyVm: only the object carrying this uid is
  // the one being asked about. A cluster-local VM that happens to share the
  // name is not.
  string uid = 2;
  uint32 lines = 3;
  // Substring filters applied on the node before the line limit. Any hide
  // match drops a line; nonempty only requires at least one match. Empty
  // filters retain all lines.
  repeated string hide = 4;
  repeated string only = 5;
  // Streams to read. Empty selects guest console/serial; VMM diagnostics
  // are returned only when explicitly requested.
  repeated string streams = 6;
}

// Idempotent by name and acked after the cluster wrote its object, not after
// the VM boots — the phase travels up through ClusterStatus, exactly as it
// travels up to the cluster through StatusReport.
message CreateVm {
  string name = 1;
  // The cluster tier's VmSpec as JSON: runStrategy plus the agent's NewVmSpec
  // verbatim under `vm`. One spec format the whole way down.
  string spec_json = 2;
  // Cloud object incarnation. Adoption requires this exact UID, so name
  // reuse cannot take ownership of an unrelated object.
  string uid = 3;
  // Tenant VNI resolved at the cloud and injected by the cluster into NICs
  // without explicit overlay or provider-network settings. Unset supplies no
  // tenant overlay. Explicit standalone NIC VNIs remain unchanged.
  optional uint32 vni = 4;
  // Cloud-resolved floating addresses reserved for this VM. The cluster
  // injects them into NIC facts for the node source guard. Empty means none.
  repeated string floating_ips = 5;
  // Cloud-resolved tenant routed prefixes used by NIC source filtering.
  // Empty means no routed-prefix claim.
  repeated string routed_subnets = 6;
  // The cloud VM's metadata.labels. The cluster stores them on its copy, so a
  // spec.antiAffinity term of another cloud VM finds this one on its node; the
  // cloud ownership labels are set by the cluster over whatever arrives here.
  map<string, string> labels = 7;
}

// Set deletionTimestamp on the cluster VM. Its finalizer uses DestroyInstance
// for node cleanup; cloud removal waits for cluster absence.
message DestroyVm {
  string name = 1;
  // Same rule as CreateVm: only the object carrying this uid is ours to stamp.
  // Anything else — a cluster-local VM of the same name, a leftover from an
  // older incarnation — is acked untouched rather than torn down.
  string uid = 2;
}
