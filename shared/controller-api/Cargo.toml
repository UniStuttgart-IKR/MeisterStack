# Controller resources, store, REST policy and scheduling helpers.
[package]
name = "meister-controller-api"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { package = "meister-common", path = "../common" }
agent_api = { package = "meister-agent-api", path = "../agent-api" }
pki = { package = "meister-pki", path = "../pki" }
meister-oidc = { path = "../oidc" }
telemetry = { package = "meister-telemetry", path = "../telemetry" }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
etcd-client = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
ring = { workspace = true }
base64 = { workspace = true }
rustls-pki-types = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
axum = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
tower = { workspace = true }
tonic = { workspace = true }
proto = { package = "meister-proto", path = "../proto" }

[dev-dependencies]
toml = { workspace = true }
tempfile = { workspace = true }
meister-oidc = { path = "../oidc", features = ["testing"] }
rcgen = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
