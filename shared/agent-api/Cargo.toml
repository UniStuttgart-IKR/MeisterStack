# Shared agent contracts and VM schema types; no driver implementations.
[package]
name = "meister-agent-api"
version = "0.1.0"
edition = "2024"

[dependencies]
uuid = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
common = { package = "meister-common", path = "../common" }
nix = { workspace = true }
libc = { workspace = true }
tokio = { workspace = true }
# The bounded subprocess helper's warning about a child it could not reap. See `subprocess`.
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# `start_paused`: the reap bound is asserted on the runtime's clock, not by waiting it out.
tokio = { workspace = true, features = ["test-util"] }
