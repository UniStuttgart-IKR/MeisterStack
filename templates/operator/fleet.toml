# Schema 2 inventory: host identity, groups, addresses and deployment policy.
# Keep credentials outside this committed file.

schema = 2

[fleet]
name = "my-fleet"
# Addons require a resolvable domain matching their identity-provider URL.
# domain = "lab.example"

[defaults]
ssh = { user = "root", port = 22 }
profiles = ["base"]
# Default boot mode; groups and hosts can override it.
# uefi uses an ESP and systemd-boot; direct gets boot files from the provider.
# Existing grub hosts manage their own bootloader and cannot use this installer.
boot = "uefi"
# Require approval for reboot; other policies are auto and never.
rollout = { max_unavailable = 1, reboot = "approve" }
checks = { required = ["units", "session"] }
# Optional trusted binary caches; inventory lists accumulate.
# managed = { substituters = ["http://build.example/cache"] }

# Operator-side paths; keep secret material outside the repository.
# [operator]
# cli_config = "cli.toml"
# cli_profile = "cloud-mtls"
# ca_dir = "../my-fleet-pki"

# Raft groups describe quorum members; compute groups describe workload hosts.
# Custom groups provide selection and shared configuration.

[[group]]
id = "cp"
kind = "raft"
profiles = ["controller"]

[[group]]
id = "compute"
kind = "compute"
profiles = ["compute-cpu"]
rollout = { canary = "compute-cpu" }

# Hosts.

[[host]]
# Stable host identifier; do not reuse it for a different machine.
id = "cp-1"
# Operating-system hostname.
name = "cp-1"
# nixos hosts are built here; context hosts have externally rendered configuration.
deployment = "nixos"
roles = ["cloud", "cluster"]
groups = ["cp"]
site = "my-site"
failure_domain = "rack1"
# Management address. static = true also requests interface configuration.
networks.management = { address = "10.0.0.10", prefix = 24, interface = "eno1" }
# Record a fingerprint verified through the console or another trusted channel.
# ssh.host_key = "SHA256:…"

# Declare required persistent mounts by label.
# persistence = [{ path = "/var/lib/meister-data", device = "label:meister-data", required = true }]

# Installation selects a disk by serial and a layout relative to this file.
# authorized_keys contains public installer access keys.
# install = { disk = { serial = "…", size_gb = 960 }, layout = "disko/single-nvme.nix", preserve = ["/var/lib/meister-data"], authorized_keys = ["<the one line of your ~/.ssh/id_ed25519.pub>"] }
modules = ["hosts/cp-1.nix"]

[[host]]
id = "a1"
name = "a1"
deployment = "nixos"
roles = ["agent"]
groups = ["compute"]
# Derive controller addresses from this group.
controller_group = "cp"
site = "my-site"
failure_domain = "rack1"
networks.management = { address = "10.0.0.11", prefix = 24, interface = "eno1" }
# Declared capabilities determine which hardware checks are applicable.
capabilities = ["kvm"]
modules = ["hosts/a1.nix"]

# Optional external dependency; MeisterStack does not deploy it.
#
# [[service]]
# id = "observability-external"
# kind = "observability"
# managed = false
# required = false
# endpoint = { loki = "http://10.0.5.10:3100/loki/api/v1/push" }
# trust_ref = "trust/external-ca.crt"
