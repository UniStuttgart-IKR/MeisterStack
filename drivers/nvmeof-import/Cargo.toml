[package]
name = "meister-nvmeof-import-driver"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
agent-api = { package = "meister-agent-api", path = "../../shared/agent-api" }
# The attacher half. A pool whose provider is `nvmeof-import` is attached with
