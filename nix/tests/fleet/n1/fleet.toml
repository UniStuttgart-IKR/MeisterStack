# Test inventory. Keep layouts and host modules beside this file so relative
# paths resolve inside the repository. Fingerprints and disks are test fixtures.

schema = 2

[fleet]
name = "vm-direct"
domain = "vm.example"

[defaults]
ssh = { user = "root", port = 22 }
profiles = [ ]
rollout = { max_unavailable = 1, reboot = "approve" }
checks = { required = [ ] }

[[group]]
id = "cp"
kind = "raft"

[[host]]
id = "n1"
name = "n1"
deployment = "nixos"
roles = ["cloud", "cluster"]
groups = ["cp"]
controller_group = "cp"
site = "vm"
boot = "direct"
networks.management = { address = "192.168.1.3", prefix = 24, interface = "eth1" }
install = { disk = { serial = "MEISTERDIRECT1", size_gb = 16 }, layout = "disko/single-direct.nix", preserve = [] }
modules = ["hosts/n1.nix"]
