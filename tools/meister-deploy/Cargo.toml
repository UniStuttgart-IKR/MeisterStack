[package]
name = "meister-deploy"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The fleet plan, and the order a deployment happens in"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
# Process-group cancellation, signal handling and workstation identity in locks.
nix = { workspace = true, features = ["hostname"] }
# Shared key/CSR generation and verification; the external CA performs signing.
pki = { package = "meister-pki", path = "../../shared/pki" }
# JSON contracts, schemas, content hashes and UUIDv7 run identifiers.
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
