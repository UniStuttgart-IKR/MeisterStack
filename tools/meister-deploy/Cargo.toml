[package]
name = "meister-deploy"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The fleet plan, and the order a deployment happens in"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
# killpg and sigaction: a deadline has to take the whole process group with
# it, and the SIGINT the child no longer receives has to be caught here.
nix = { workspace = true }
# The contracts: JSON on the wire, a JSON Schema for the `schema` verb, a
# sha256 for every content id, a uuid v7 for every run.
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
