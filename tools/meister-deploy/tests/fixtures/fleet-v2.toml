#
# The inventory of the design brief, section 8c, written out: one controller,
# one GPU agent, one context VM. It is a FIXTURE — the tests edit it line by
# line, so a line moved here is a test that has to move with it.

schema = 2

[fleet]
name = "uni-lab"
domain = "lab"

[defaults]
ssh = { user = "root", port = 22 }
profiles = ["base"]
rollout = { max_unavailable = 1, reboot = "approve", canary = "hardware-class" }
checks = { required = ["units", "session", "mounts"] }

# References, never secrets: this file is committed.
[operator]
cli_config = "cli.toml"
cli_profile = "cloud-mtls"
ca_dir = "../labpki"

[[group]]
id = "cloud"
kind = "raft"
profiles = ["controller"]

[[group]]
id = "compute_pro6000"
kind = "compute"
profiles = ["compute-gpu-pro6000"]
rollout = { reboot = "never" }
checks = { required = ["gpu"] }

[[host]]
id = "cloud-a"
name = "meister-cloud"
deployment = "nixos"
roles = ["cloud", "addons"]
groups = ["cloud"]
site = "ikr-lab"
failure_domain = "rack1"
networks.management = { address = "10.128.1.103", prefix = 24, interface = "eno1" }
ssh.host_key = "SHA256:5ZqB3rJZ4S1q0mQHq1n8Xx0yv2nQ0h2cQ8oO1pWd3kI"
install = { disk = { serial = "S6PENX0T123456", size_gb = 960 }, layout = "disko/single-nvme.nix", preserve = ["/var/lib/meister-data"] }
persistence = [{ path = "/var/lib/meister-data", device = "label:meister-data", required = true }]
modules = ["hosts/cloud-a.nix"]

[[host]]
id = "gpu-01"
name = "agent-2b"
deployment = "nixos"
roles = ["agent"]
groups = ["compute_pro6000"]
controller_group = "cloud"
site = "ikr-lab"
failure_domain = "rack2"
networks.management = { address = "10.128.1.111", prefix = 24, interface = "eno1" }
ssh.port = 2222
capabilities = ["kvm", "vfio", "rdma"]
hardware.gpus = [{ model = "NVIDIA RTX PRO 6000", pci = "0000:41:00.0" }]
hardware.nics = [{ name = "mlx0", mac = "b8:ce:f6:00:00:01", role = "storage", rdma = true }]
deviations.settings.agent = { network = { bgp = { asn = 65001 } } }

[[host]]
id = "ctx-agent-1"
name = "agent-1"
deployment = "context"
roles = ["agent"]
controller_group = "cloud"

[[service]]
id = "observability-external"
kind = "observability"
managed = false
required = false
endpoint = { loki = "http://10.0.5.10:3100/loki/api/v1/push" }
trust_ref = "trust/external-ca.crt"
