# MeisterStack cli configuration. Checkout-only development fixture; do not deploy it. See config/README.md.
# Relative paths resolve against this file's directory. See docs/CONFIGURATION.md.
# Prose uses "# "; optional settings use "#key". Keep top-level settings above tables.
# Lookup: --config / MEISTER_CONFIG, user config.toml, then /etc/meisterstack/cli.toml.

# Used unless --profile or MEISTER_PROFILE selects another profile. An endpoint
# override changes the address while retaining selected profile credentials.
# MEISTER_TOKEN overrides the profile credential.
default_profile = "lab"

# Local agent administration over a Unix socket; access is controlled by
# filesystem permissions. Use the agent command tree.
[profiles.lab]
endpoint = "unix:///tmp/run/meisterstack/agent.sock"
credential = { type = "none" }

# Cluster operator endpoint. Ordinary cloud User identities are refused here.
[profiles.cluster-a]
endpoint = "https://cluster-a.lab.internal:8443"

# CA certificate and key for signing approved CSRs. Without the signer,
# requests can be recorded but certificate issuance is unavailable.
ca_cert = "data/meisterstack/ca.pem"
credential = { type = "token_file", path = "token" }

# Cloud API profile used by ordinary users and operators.
[profiles.cloud]
endpoint = "http://10.128.1.103:3000"
credential = { type = "none" }
