# MeisterStack cli configuration. Edit addresses, paths, and identities before use.
# Relative paths resolve against this file's directory. See docs/CONFIGURATION.md.
# Prose uses "# "; optional settings use "#key". Keep top-level settings above tables.
# Lookup: --config / MEISTER_CONFIG, user config.toml, then /etc/meisterstack/cli.toml.

# Used unless --profile or MEISTER_PROFILE selects another profile. An endpoint
# override changes the address while retaining selected profile credentials.
# MEISTER_TOKEN overrides the profile credential.
default_profile = "lab"

# Local agent administration over a Unix socket; access is controlled by
# filesystem permissions. Use the agent command tree.
[profiles.lab]
endpoint   = "unix:///run/meisterstack/agent.sock"
credential = { type = "none" }

# Cluster operator endpoint. Ordinary cloud User identities are refused here.
[profiles.cluster-a]
endpoint   = "http://10.128.1.104:3001"

# Per-request deadline; default 30 seconds.
timeout_secs = 30
credential = { type = "token_file", path = "token" }

# Cloud API profile used by ordinary users and operators.
[profiles.cloud]
endpoint   = "http://10.128.1.103:3000"
credential = { type = "none" }

# HTTPS requires an explicit controller CA. Login writes or renews the named
# key and certificate; first enrollment needs an accepted bootstrap credential.
[profiles.cloud-mtls]
endpoint   = "https://10.128.1.103:3000"

# CA certificate and key for signing approved CSRs. Without the signer,
# requests can be recorded but certificate issuance is unavailable.
ca_cert    = "pki/ca.crt"
credential = { type = "mtls", cert = "pki/cloud-mtls.crt", key = "pki/cloud-mtls.key" }

# OIDC login uses authorization code with PKCE when discovery supports it,
# otherwise the device grant. Access tokens are refreshed from the saved session.
# Default tokens path: <config directory>/oidc/<profile>.json. For user login,
# keep this profile in a writable per-user config or set a private tokens path.
# The cloud still requires a User record unless provisioning is enabled.
[profiles.cloud-oidc]
endpoint   = "https://10.128.1.103:3000"

# CA certificate and key for signing approved CSRs. Without the signer,
# requests can be recorded but certificate issuance is unavailable.
ca_cert    = "pki/ca.crt"
credential = { type = "oidc", issuer = "https://idp.example.org/realms/lab", client_id = "meisterstack" }
