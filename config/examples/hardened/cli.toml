# MeisterStack cli configuration. Edit addresses, paths, and identities before use.
# Relative paths resolve against this file's directory. See docs/CONFIGURATION.md.
# Prose uses "# "; optional settings use "#key". Keep top-level settings above tables.
# Lookup: --config / MEISTER_CONFIG, user config.toml, then /etc/meisterstack/cli.toml.
# mTLS exposure example; network and backend access still require site configuration.

# Used unless --profile or MEISTER_PROFILE selects another profile. An endpoint
# override changes the address while retaining selected profile credentials.
# MEISTER_TOKEN overrides the profile credential.
default_profile = "cloud"

# Cloud API profile used by ordinary users and operators.
[profiles.cloud]
endpoint = "https://cloud.example.net:3000"

# CA certificate and key for signing approved CSRs. Without the signer,
# requests can be recorded but certificate issuance is unavailable.
ca_cert = "pki/ca.crt"
credential = { type = "mtls", cert = "pki/alice.crt", key = "pki/alice.key" }

# Per-request deadline; default 30 seconds.
timeout_secs = 30

# Loopback cluster access through an SSH tunnel, for example
# ssh -L 3001:127.0.0.1:3001 cluster-1. The server certificate must cover
# 127.0.0.1; use a machine or break-glass identity accepted by the cluster.
[profiles.cluster-1]
endpoint = "https://127.0.0.1:3001"

# CA certificate and key for signing approved CSRs. Without the signer,
# requests can be recorded but certificate issuance is unavailable.
ca_cert = "pki/ca.crt"
credential = { type = "mtls", cert = "pki/admin.crt", key = "pki/admin.key" }

# Alternative cluster address on the management network.
#[profiles.cluster-1-mgmt]
#endpoint = "https://10.128.1.104:3001"

# CA certificate and key for signing approved CSRs. Without the signer,
# requests can be recorded but certificate issuance is unavailable.
#ca_cert = "pki/ca.crt"
#credential = { type = "mtls", cert = "pki/admin.crt", key = "pki/admin.key" }

# Local agent socket. Its filesystem permissions grant full node administration.
[profiles.node-local]
endpoint = "unix:///run/meisterstack/agent.sock"
credential = { type = "none" }
