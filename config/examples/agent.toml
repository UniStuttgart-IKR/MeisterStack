# MeisterStack agent configuration. Edit addresses, paths, and identities before use.
# Relative paths resolve against this file's directory. See docs/CONFIGURATION.md.
# Prose uses "# "; optional settings use "#key". Keep top-level settings above tables.

# [hypervisor.cloud-hypervisor] and [network].default_bridge are the whole

# Stable node identity, unique within the cluster. Its session certificate
# uses CN=system:node:<node_id>. Duplicate identities replace sessions.
node_id = "manacor"

# Optional controller session. A nonempty controller_addrs list takes precedence.
# Without either address the agent runs standalone.
#controller_addr  = "http://10.128.1.104:50051"

# Replica preference uses rendezvous hashing with bounded dial attempts.
# Use https URLs to enable TLS; PEM paths alone do not enable it.
controller_addrs = ["http://10.128.1.104:50051", "http://10.128.1.110:50051"]

# Grace period for guest shutdown before the VMM is terminated.
#stop_grace_secs = 30

# Source and destination watchdog ceilings, in seconds. Keep both above the
# cluster migration_transfer_secs deadline. They bound uncertain local work;
# they do not guarantee that every destination timeout preserves its resources.
# See docs/MIGRATION.md for recovery and cleanup limits.
#migrate_out_ceiling_secs = 600
#receive_ceiling_secs = 600

# Physical host identity for nested nodes. Cross-host nested live migration
# is refused unless source and destination identify the same physical host.
#physical_host = "palma"

# Optional OTLP/gRPC trace collector. Logging remains enabled without it.
#otlp_endpoint = "http://127.0.0.1:4317"

# Log output format: human (default) or JSON. See docs/OBSERVABILITY.md.
#log_format = "json"

# Optional unauthenticated Prometheus listener. Restrict access separately;
# use different ports for processes sharing a host.
#metrics_listen = "127.0.0.1:9100"

# Session trust anchor and node client certificate. The certificate/key pair
# requires a CA. Keys must have no group or other permission bits. A cluster
# requiring mTLS also requires the client pair; CA-only does not authenticate a node.
#controller_ca   = "pki/ca.crt"
#controller_cert = "pki/system-node-manacor.crt"
#controller_key  = "pki/system-node-manacor.key"

# Capacity ceilings only lower measured host capacity. For multiple agents on
# one machine, also isolate node_id, database, run directory, and cgroup root.
#capacity_vcpus   = 32
#capacity_mem_mib = 128000

# Enforce CPU placement in the agent's cgroup subtree. Include SMT siblings
# when choosing CPU lists; reported capacity alone does not pin workloads.
#cgroup_cpuset    = "0-15,32-47"
# cgroup_cpuset = "16-31,48-63", and its own [paths].

# Floating-pool ranges blocked as guest source addresses, except reservations
# in that VM's spec. Keep this union aligned with cloud pools. MAC pinning is
# always applied; routed subnets add a source allowlist. Reachability still
# needs upstream routing or a guest/router appliance.
#guarded_ranges = ["10.255.0.0/16", "203.0.113.7", "203.0.113.16-203.0.113.19"]

# nftables executable; defaults to PATH. Rule programming is required.
#nft = "/run/current-system/sw/bin/nft"

# Persistent records and disks must survive together. Runtime sockets can use tmpfs.
[paths]

# Agent VM and volume records used for reconciliation and restart adoption.
db_path    = "/var/lib/meisterstack/agent.redb"

# Local administration socket and per-VM runtime files. The socket defaults to
# 0600; configuring socket_group grants its members full local administration.
run_dir    = "/run/meisterstack"

# Base-image directory. Files must be available on each selected node; a shared
# mount can provide the same namespace across nodes.
image_dir  = "/var/lib/meisterstack/images"

# Directory for filesystem-backed volumes.
volume_dir = "/var/lib/meisterstack/volumes"

# Delegated or privileged cgroup-v2 subtree for VMMs and backend processes.
cgroup_root = "/sys/fs/cgroup/meisterstack"

# Patched Cloud Hypervisor build; see nix/packages/cloud-hypervisor.nix.
[hypervisor.cloud-hypervisor]

# Backend executable path.
binary     = "/opt/meisterstack/bin/cloud-hypervisor"

# Deadline for a local Cloud Hypervisor API call, in milliseconds.
timeout_ms = 5000

# Deadline for guest-cooperative hot-unplug. A timeout is not proof that the
# VMM released a disk; choose a value suitable for the guest images.
#unplug_timeout_secs = 30

# Default guest bridge; tenant overlays use separate per-VNI bridges.
[network]
default_bridge = "meister_br0"

# Optional address installed on the default bridge, with or without a controller.
#bridge_addr = "192.168.100.1/24"

# Remove unreferenced driver-owned overlay links once at startup, only after
# the complete record table is readable. Disable when another operator owns them.
#sweep_orphans = true

# Optional tenant overlays: meister-vx<VNI> bridges and mvx<VNI> tunnels.
# Multicast uses a group derived from the VNI unless EVPN is enabled.
#[network.vxlan]

# Underlay interface. Multicast must be supported unless using EVPN.
# Check NIC UDP-tunnel offload support when sizing the fabric.
#uplink = "eno1"

# Overlay MTU; 1450 leaves room for IPv4 VXLAN on a 1500-byte underlay.
# Keep it consistent with the physical network and guest configuration.
#mtu = 1450

# Use FRR EVPN instead of multicast learning; requires network.bgp. All
# nodes in an overlay must agree on this choice.
#evpn = false
# Present = this node has given one or more interfaces away to provider

# Map short provider-network names to dedicated interfaces without host IP
# addresses. Router namespaces and explicit physnet NICs use these bridges.
#[network.provider]
#physnets = { ext = "eth1" }

# iproute2 executable for namespace creation and persistent namespace pins.
#ip = "/run/current-system/sw/bin/ip"
# Present = this node runs a BGP session and announces a /32 for every

# Requires running FRR bgpd and zebra. Reconcile announces /32 floating IPs
# for locally running VMs and withdraws stale routes. Routed subnet prefixes
# are not announced per host; configure their routing externally.
#[network.bgp]
#asn = 65001

# Explicit BGP router identifier, independent of guest bridge addresses.
#router_id = "10.128.1.10"

# FRR client and optional socket directory.
#vtysh      = "/run/current-system/sw/bin/vtysh"
#vty_socket = "/run/frr"

# Rendered FRR configuration path; defaults beneath run_dir for inspection.
#fragment = "/run/meisterstack/meister-bgp.conf"

# One table per numbered BGP neighbor.
#[[network.bgp.neighbors]]
#address    = "10.128.1.1"
#remote_asn = 65000

# Filesystem volumes are registered by default; these overrides replace paths.
#[volume.filesystem]

# Base-image directory. Files must be available on each selected node; a shared
# mount can provide the same namespace across nodes.
#image_dir  = "/srv/images"

# Directory for filesystem-backed volumes.
#volume_dir = "/srv/volumes"

# Thin pool must already exist. The driver checks availability at startup.
#[volume.lvm-thin]
#vg        = "meister"
#thin_pool = "thin"

# Reject allocation above this physical pool-fill percentage to avoid pool exhaustion.
#max_data_percent = 90.0

# Base-image directory. Files must be available on each selected node; a shared
# mount can provide the same namespace across nodes.
#image_dir = "/srv/images"
#bin_dir   = "/run/current-system/sw/bin"
#qemu_img  = "qemu-img"

# Shared files or virtiofs directories beneath share_root. The host mount may
# use NFS or another filesystem. Configure shared storage before placing VMs.
#[volume.nfs]
#share_root = "/srv/meister-share"

# One virtiofsd backend per share attachment.
#virtiofsd  = "/opt/meisterstack/bin/virtiofsd"

# Base-image directory. Files must be available on each selected node; a shared
# mount can provide the same namespace across nodes.
#image_dir  = "/srv/images"

# Deadline for the backend's Unix socket to appear.
#socket_timeout_ms = 5000

# Additional backend arguments; select sandbox behavior for the host privileges.
#virtiofsd_args = ["--sandbox=none", "--cache=auto"]

# False uses an existing mount; true mounts server/export at driver startup.
#manage_mount = true
#server     = "10.0.8.21"
#export     = "/exports/meister"
#mount_opts = "vers=4.2,hard,noatime"
#fs_type    = "nfs"

#   [paths]
#   image_dir = "/srv/meister-share/images"    # the SAME path on every node

# False uses an existing mount; true mounts server/export at driver startup.
# manage_mount = true above); locally it is one directory two agent processes

# Configure the crosvm GPU backend only on nodes that provide it.
#[device.crosvm-gpu]

# Backend executable path.
#binary = "/opt/meisterstack/bin/crosvm"

# Deadline for the backend's Unix socket to appear.
#socket_timeout_ms = 5000

# Merge device settings in order: defaults < named profile < VM parameters.
#[device.crosvm-gpu.defaults]
#backend                 = "virglrenderer"
#vulkan                  = true
#context_types           = "venus"
#external_blob           = true
#pci_bar_size            = 2147483648   # bytes; effectively the guest's VRAM
#implicit_render_server  = true

# Profiles are advertised as driver/profile capabilities for placement.
#[device.crosvm-gpu.profiles.venus]
#context_types = "venus"

#[device.crosvm-gpu.profiles.gfxstream]
#backend       = "gfxstream"
#context_types = "gfxstream-vulkan"

# NVIDIA mediated backend. vgpuprofile resolves profile limits against the card.
#[device.nvrm]

# Backend executable path.
#binary      = "/opt/meisterstack/bin/vhost-user-nvrm"
#vgpuprofile = "/opt/meisterstack/bin/vgpuprofile"

# Deadline for the backend's Unix socket to appear.
#socket_timeout_ms = 5000

# Optional hard VRAM admission budget. Once a vGPU type is on the card, the
# card itself is a hard limit too: per-type max_instance, all admitted
# sizes together within vgpu_available_mib, and no backend without a
# vgpu_type beside them (a size of its own is vgpu_type = "<N>M").
# Without either, overcommit is only warned about. Admission counts the
# devices of every vm this node has a record of, running or stopped: a
# stopped vm keeps its share.
#vram_budget_mib = 8192

# The host's share of the card in MiB that vgpuprofile subtracts before it
# derives vGPU types. Required once a vgpu_type is configured or requested:
# measured instead, the running guests would count as the host's share after
# an agent restart and the same type would resolve to a smaller card.
#vgpu_host_reserve_mib = 1024

# Merge defaults < profile < VM parameters. The merged result may name one of
# vgpu_type, vram_profile_mib and vram_limit_mib. env may not set a variable a
# typed field writes.
#[device.nvrm.defaults]
#vgpu_type        = "RTX2070-4Q"
#vram_reserve_mib = 256
#managed_compat   = true
#admin_priv       = false

#[device.nvrm.profiles.2q]
#vgpu_type = "RTX2070-2Q"

#[device.nvrm.profiles.4q]
#vgpu_type = "RTX2070-4Q"

#[device.nvrm.profiles.8q]
#vgpu_type = "RTX2070-8Q"

# Upstream virtio-input backend. Devices require profile=evdev and an evdev
# path; the backend user needs read access and a node belongs to one guest.
#[device.input]

# Backend executable path.
#binary = "/opt/meisterstack/bin/vhost-device-input"

# Deadline for the backend's Unix socket to appear.
#socket_timeout_ms = 5000

# Allowlist complete PCI devices for the vfio driver. Only these addresses
# may be assigned; keep management devices out of this list.
#[[device.managed]]
#kind        = "passthrough"      # or "nic-sriov"
#pci_address = "0000:23:00.0"
