# meister-cluster-controller — one cluster's control plane.
#
# Normally /etc/meisterstack/cluster.toml, generated by the NixOS module
# (meisterstack.cluster.settings). Every key is optional and every one of them
# has a command-line flag that wins over the file; the defaults below are the
# lab's topology, so an empty file is a working single-cluster setup.
#
# The comment convention is mechanical because a test enforces it: prose is a
# hash and a space, a commented-out setting is a hash and the key with no
# space between, and commented-out top-level keys stay above the first
# [table] header so that uncommenting one does not move it into that table.
#
# For the locked-down variant of this file — REST on loopback, mTLS on the
# session port, one authenticator — see hardened/.

# What this cluster is called one tier up. It is the identity the cloud keeps
# its Cluster object under, and the string this controller hashes to pick
# which cloud replica it dials — so it has to be stable across restarts, and
# every replica of THIS cluster has to use the same one.
cluster_name = "cluster-1"

# The REST API operators and `meister cluster …` talk to. Cluster #n
# conventionally takes 3000+n so several can share a host.
listen_api = "0.0.0.0:3001"
# Where the agents dial in. Session ports count from 50051 for the same
# reason.
listen_session = "0.0.0.0:50051"

# This tier's store. Comma-separated; in the HA shape each controller talks to
# its own local member and Raft does the rest.
etcd_endpoints = "http://127.0.0.1:2379"
# The key prefix everything of this tier lives under. It is what lets an
# all-in-one box run both tiers against one etcd: the cloud uses /cloud, and
# no controller ever reads a foreign prefix.
etcd_prefix = "/cluster"

# --- the cloud tier, if there is one ---------------------------------------
#
# Neither key: the cluster is standalone, which is how it ran before M4 and
# how it goes on running when the cloud is away. `cloud_addrs` wins over
# `cloud_addr`; order does not matter (rendezvous hashing again), and a
# cluster that drifted off its favourite comes back when the favourite
# answers.
#cloud_addr  = "http://10.128.1.103:50050"
#cloud_addrs = ["http://10.128.1.103:50050", "http://10.128.1.112:50050"]

# What to do about a VM whose phase is Failed.
#   "crash-loop-backoff"  the default: retry forever, 10s 20s 40s … capped at
#                         5 minutes. The K8s answer, and the one a stack
#                         shaped like K8s owes its operator.
#   <n>                   at most n retries on that curve, then Failed is
#                         final.
#   "none"                Failed is final immediately.
# Quarantined is never touched by this — that phase exists precisely so that
# nothing automatic acts on the VM.
#retry = "crash-loop-backoff"

# Which placement strategy binds an unbound VM to a node. One value today,
# "first-fit", which is what this controller was wired to outright before it
# was a choice — so a file that says nothing about it gets exactly the
# placement it always had.
#
# The key exists so that the second strategy (bin packing, GPU-topology
# aware) is a line in a config file rather than an edit in two `main`s. An
# unknown name is refused at start-up and says what was expected, instead of
# quietly falling back to the default and placing VMs somebody thought they
# had stopped placing.
#scheduler = "first-fit"

# Where to send spans. Unset = log to stdout and nothing else. Set, and the
# trace of a `POST /vms` reaches through this controller into the agent and
# down to the driver that spawns the backend.
#otlp_endpoint = "http://127.0.0.1:4317"

# --- metrics ---------------------------------------------------------------
#
# Where the Prometheus exposition listens. Absent — the default — means
# NOTHING listens, and that is a security decision rather than caution: the
# REST edge is authenticated and tenant-scoped, /metrics is neither, and the
# series behind it name nodes and objects across every tenant. A stock Prometheus
# scrapes it and a stock Grafana draws it; there is no glue in between,
# because every name carries the meister_ prefix, its unit (_seconds, _total)
# and only labels whose value ranges are bounded.
#
# Loopback, because the scraper should be on the box or reach it through
# something that already decides who may ask. One port per PROCESS: an
# all-in-one box runs three of these and they cannot share 9090.
#
# The flag `--metrics-listen` with no value takes 127.0.0.1:9090.
#metrics_listen = "127.0.0.1:9091"

# --- tls and identity ------------------------------------------------------
#
# PEM paths, never PEM, resolved against THIS file — so a config and its pki/
# directory travel as one unit, which is what `tools/meister-ca` produces.
# All of it off by default: plain http on :3001, plain gRPC on :50051, every
# request anonymous. That is the shape the lab has run in since M1 and
# nothing here changes it until these keys are set.

# The serving certificate for BOTH ports — the REST API operators talk to and
# the session port the agents dial. Set both or neither.
#tls_cert = "pki/cluster-1.crt"
#tls_key = "pki/cluster-1.key"

# The CA that client certificates must chain to: an operator's, and the
# agents'. Setting it makes both ports ask for one and puts the mTLS
# authenticator in the chain.
#
# There is deliberately no user directory at this tier — the users live at
# the cloud, once — so the role comes out of the certificate here. The price
# is honest and worth naming: a demotion takes effect at the cloud on the
# next request, and here when the certificate is re-issued.
#client_ca = "pki/ca.crt"

# --- dialling the cloud ----------------------------------------------------
#
# The other direction, and separate keys because it is a separate decision: a
# cluster can serve plain and dial TLS, or the other way round, and during a
# rollout it will do exactly that. cloud_cert is this cluster's own identity,
# CN=system:cluster:<cluster_name> — the cloud checks it against the name in
# the Hello, so one cluster's key cannot speak for another's VMs.
#cloud_ca = "pki/ca.crt"
#cloud_cert = "pki/system-cluster-cluster-1.crt"
#cloud_key = "pki/system-cluster-cluster-1.key"

# The authenticator chain, in order; see the cloud example for what each link
# is and why the order matters. An [auth] table that configures nothing is
# still the anonymous mode.
# --- admission: does the machine actually have room ------------------------
#
# Until this existed the scheduler filtered on connected and schedulable and
# then placed, without ever asking whether the node could carry the VM. So
# `schedulable` was half a truth: the node was placeable until it OOMed. In
# the lab, three nodes with the same catalogue took EVERY overlay vm onto
# whichever sorted first.
#
# What is free is derived per pass and never stored: the reported capacity,
# times the factors below, minus everything already bound there — Pending vms
# included, because a vm that is bound and not yet started is a claim.
#
# The verdict is made at the BINDING and not at the API edge, and the reason
# is arithmetic rather than taste: at the edge the objects that would have to
# be counted do not exist yet, so two creates in one breath would both be told
# there is space. A pass places one after another and spends as it goes.
#
# The two factors are asymmetric on purpose. Overcommitting MEMORY means the
# OOM killer picks a vm and ends it; overcommitting vCPU means the guests wait
# for each other. One is a lost vm, the other is a slow one. So memory is 1.0
# and this control plane refuses to start with anything above it, while vcpu
# defaults to 4.0 — the one number here that is a judgement rather than a
# derivation. A fleet that was relying on the unlimited placement this stack
# had before admission existed raises it.
#
# A vm that fits nowhere stays Pending with `no candidate has room for N vcpu
# and M MiB` on the object, and shows up in
# meister_scheduler_pending_vms{reason="no-capacity"}.
[admission]
#vcpu = 4.0
#memory = 1.0

# No [auth.oidc] here, and that is not an omission. This tier keeps no user
# directory — the users live at the cloud, once — so it cannot turn a token's
# name into a role, and a token would authenticate somebody it could then
# permit nothing. An [auth.oidc] table at this tier is a start-up error. What
# talks to a cluster controller is machinery, and machinery has certificates.
[auth]
#chain = ["mtls", "bearer"]
#bearer_token_file = "pki/dev-token"
#bearer_identity = "dev-admin"
#bearer_groups = ["system:masters"]
