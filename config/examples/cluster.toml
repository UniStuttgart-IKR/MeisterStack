# MeisterStack cluster configuration. Edit addresses, paths, and identities before use.
# Relative paths resolve against this file's directory. See docs/CONFIGURATION.md.
# Prose uses "# "; optional settings use "#key". Keep top-level settings above tables.
# The cluster has no human-user directory and rejects ordinary user certificates.
# Machine and break-glass identities use this tier; users call the cloud API.

# [table] header so that uncommenting one does not move it into that table.

# Stable logical cluster identity, shared by replicas and their system:cluster certificate.
cluster_name = "cluster-1"

# REST API bind address. Use a reachable advertise_api for replica forwarding.
listen_api = "0.0.0.0:3001"

# Host and port reachable by other replicas. The URL scheme follows serving TLS.
#advertise_api = "10.128.1.104:3001"

# Internal gRPC session bind address; permit the peer tier to reach it.
listen_session = "0.0.0.0:50051"

# Comma-separated etcd client endpoints. The NixOS deployment uses local members.
etcd_endpoints = "http://127.0.0.1:2379"

# Isolate this controller tier in its own etcd key prefix.
etcd_prefix = "/cluster"

# Optional upstream session. The nonempty cloud_addrs list takes precedence.
# Replica preference uses rendezvous hashing. Use https URLs with TLS credentials.
#cloud_addr  = "http://10.128.1.103:50050"

# Cloud session replicas. HTTPS selects TLS; PEM paths alone do not enable it.
#cloud_addrs = ["http://10.128.1.103:50050", "http://10.128.1.112:50050"]

# Failed-VM retry policy: crash-loop-backoff, a retry count, or none.
# Backoff starts at 10 seconds and caps at five minutes; Quarantined is excluded.
#retry = "crash-loop-backoff"

# Placement strategy; currently first-fit. Unknown names fail startup.
#scheduler = "first-fit"

# Optional OTLP/gRPC trace collector. Logging remains enabled without it.
#otlp_endpoint = "http://127.0.0.1:4317"

# Log output format: human (default) or JSON. See docs/OBSERVABILITY.md.
#log_format = "json"

# Optional unauthenticated Prometheus listener. Restrict access separately;
# use different ports for processes sharing a host.
#metrics_listen = "127.0.0.1:9091"

# Serving certificate and private key for both REST and session listeners.
# Configure both together; SANs must cover every address clients dial.
#tls_cert = "pki/cluster-1.crt"
#tls_key = "pki/cluster-1.key"

# Trust anchor for client certificates. TLS requests a certificate; the
# authenticator chain decides whether missing credentials are acceptable.
#client_ca = "pki/ca.crt"
# CN=system:cluster:<cluster_name> — the cloud checks it against the name in

# Trust the cloud serving certificate and present the cluster identity.
# The identity CN must match system:cluster:<cluster_name>.
#cloud_ca = "pki/ca.crt"
#cloud_cert = "pki/system-cluster-cluster-1.crt"
#cloud_key = "pki/system-cluster-cluster-1.key"

# Shared 32-byte encryption key for cloud and cluster Secret objects. Keep it
# private and backed up; replacing it makes existing ciphertext unreadable.
# Agents receive resolved plaintext over their authenticated sessions.
#secrets_key = "pki/secrets.key"

# Placement subtracts all bound VM claims, including Pending VMs, from reported
# capacity. CPU defaults to 4x; memory defaults to 1x and cannot exceed 1x.
[admission]
#vcpu = 4.0
#memory = 1.0

# Authenticators are ordered and stop on rejection. Explicit chains require their
# credentials; session-serving controllers require mTLS in the chain. Without a
# configured authenticator the controller refuses to start unless `anonymous`
# asks for anonymous, unrestricted access.
[auth]

# This example configures no authenticator, so it asks for the anonymous mode:
# every request is served without credentials and with every permission. Only
# for a throwaway local controller; remove it once client_ca or a token is set.
anonymous = true

# mTLS authenticates sessions and operator calls; OIDC is not supported at this tier.
#chain = ["mtls", "bearer"]

# Development or bootstrap bearer token, read from a file at startup.
# The default system:masters group bypasses ordinary user-directory authorization.
#bearer_token_file = "pki/dev-token"
#bearer_identity = "dev-admin"
#bearer_groups = ["system:masters"]
