# MeisterStack cloud configuration. Edit addresses, paths, and identities before use.
# Relative paths resolve against this file's directory. See docs/CONFIGURATION.md.
# Prose uses "# "; optional settings use "#key". Keep top-level settings above tables.

# [table] header so that uncommenting one does not move it into that table.

# Stable logical cloud identity, shared by replicas and their system:cloud certificate.
#cloud_name = "lab"

# REST API bind address. Use a reachable advertise_api for replica forwarding.
listen_api = "0.0.0.0:3000"

# Internal gRPC session bind address; permit the peer tier to reach it.
listen_session = "0.0.0.0:50050"

# Comma-separated etcd client endpoints. The NixOS deployment uses local members.
etcd_endpoints = "http://127.0.0.1:2379"

# Isolate this controller tier in its own etcd key prefix.
etcd_prefix = "/cloud"

# Optional OTLP/gRPC trace collector. Logging remains enabled without it.
#otlp_endpoint = "http://127.0.0.1:4317"

# Log output format: human (default) or JSON. See docs/OBSERVABILITY.md.
#log_format = "json"

# Optional unauthenticated Prometheus listener. Restrict access separately;
# use different ports for processes sharing a host.
#metrics_listen = "127.0.0.1:9090"

# Lower bound for monotonic tenant VNI allocation. Increasing it advances future
# allocation; lowering it does not reclaim identifiers. Maximum: 99999.
#vni_base = 10000

# Super-pools for automatic routed-subnet allocation. Explicit CIDRs remain
# possible without pools. Upstream routing is configured outside MeisterStack.
#routed_pools = ["10.7.0.0/16"]

# Placement strategy; currently first-fit. Unknown names fail startup.
#scheduler = "first-fit"

# Serving certificate and private key for both REST and session listeners.
# Configure both together; SANs must cover every address clients dial.
#tls_cert = "pki/meister-cloud.crt"
#tls_key = "pki/meister-cloud.key"

# Trust anchor for client certificates. TLS requests a certificate; the
# authenticator chain decides whether missing credentials are acceptable.
#client_ca = "pki/ca.crt"
# O=system:clouds, from `tools/meister-ca --cloud <name>`. `push.sh pki` puts

# Cloud client identity used to forward requests to sibling replicas.
# Its CN must be system:cloud:<cloud_name>.
#identity_cert = "pki/system-cloud-lab.crt"
#identity_key = "pki/system-cloud-lab.key"

# Shared 32-byte encryption key for cloud and cluster Secret objects. Keep it
# private and backed up; replacing it makes existing ciphertext unreadable.
# Agents receive resolved plaintext over their authenticated sessions.
#secrets_key = "pki/secrets.key"

# CA certificate and key for signing approved CSRs. Without the signer,
# requests can be recorded but certificate issuance is unavailable.
#ca_cert = "pki/ca.crt"
#ca_key = "pki/ca.key"

# Lifetime of certificates issued through the CSR API.
#cert_ttl_days = 90

# Approve eligible CSR requests immediately when true; otherwise an admin
# approves them explicitly. Disabled by default.
#csr_auto_approve = true

# Placement subtracts all bound VM claims, including Pending VMs, from reported
# capacity. CPU defaults to 4x; memory defaults to 1x and cannot exceed 1x.
[admission]
#vcpu = 4.0
#memory = 1.0

# Authenticators are ordered and stop on rejection. Explicit chains require their
# credentials; session-serving controllers require mTLS in the chain. Without
# configured authenticators the controller accepts anonymous unrestricted access.
[auth]

# Put OIDC before a static bearer authenticator because both read Authorization.
#chain = ["mtls", "oidc", "bearer"]

# Development or bootstrap bearer token, read from a file at startup.
# The default system:masters group bypasses ordinary user-directory authorization.
#bearer_token_file = "pki/dev-token"
#bearer_identity = "dev-admin"
#bearer_groups = ["system:masters"]

# [auth.oidc] table there is a start-up error rather than a quiet no-op.

# Cloud-only OIDC authentication. User objects supply roles and tenant membership;
# token claims cannot grant roles or machine identities.
#[auth.oidc]

# Exact HTTPS issuer from provider discovery. Configure the matching public client.
#issuer = "https://idp.example.org/realms/lab"
#client_id = "meisterstack"

# Accepted token audiences; defaults to client_id.
#audience = ["meisterstack"]

# Username claim; sub is the default. Choose a stable, non-reassigned identifier.
#username_claim = "sub"

# Explicit asymmetric signature algorithms accepted by this API.
#allowed_algorithms = ["RS256", "ES256"]

# Clock tolerance for token expiry and not-before validation.
#leeway_secs = 60

# Minimum interval between JWKS fetches triggered by unknown key IDs.
#min_refetch_interval_secs = 60

# Periodic JWKS refresh interval.
#refresh_interval_secs = 3600

# Optional CA for provider HTTPS; otherwise use platform trust roots.
#ca_cert = "pki/idp-ca.crt"

# Optional first-login provisioning: member role only, with an existing tenant
# named by tenant_claim. Otherwise an administrator creates the User.
#provision_unknown_users = false
#tenant_claim = "meister_tenant"

# CORS controls browser response access; it does not authenticate requests.
#[api]

# Allowed browser origins. Empty disables CORS; wildcard responses omit
# Access-Control-Allow-Credentials. Browser clients use their own PKCE client.
#cors_origins = ["https://ui.lab.example"]
