# meister-cloud-controller — the public tier.
#
# Normally /etc/meisterstack/cloud.toml, generated by the NixOS module
# (meisterstack.cloud.settings). Same rules as the cluster file: every key
# optional, every key has a flag that wins over it, defaults are the lab.
#
# There is deliberately nothing here about which clusters exist. A cluster
# dials in and says who it is; the cloud keeps no list of them in config,
# because a list in two places is a list that disagrees with itself.
#
# The comment convention is mechanical because a test enforces it: prose is a
# hash and a space, a commented-out setting is a hash and the key with no
# space between, and commented-out top-level keys stay above the first
# [table] header so that uncommenting one does not move it into that table.
#
# This is the one component of the stack with a public port. For the
# locked-down variant of this file — TLS, a client CA and a single-link
# authenticator chain — see hardened/.

# The END API — what a user's CLI and anything outside the lab talks to.
listen_api = "0.0.0.0:3000"
# Where the cluster-controllers dial in.
listen_session = "0.0.0.0:50050"

# This tier's store, and its prefix. /cloud and /cluster can share one etcd on
# an all-in-one box; neither tier ever reads the other's keys, and the two
# tiers exchange nothing except over the session above.
etcd_endpoints = "http://127.0.0.1:2379"
etcd_prefix = "/cloud"

# Where to send spans. Unset = log to stdout and nothing else. Set, and this
# is where a trace begins: `POST /vms` here, and the same trace id comes out
# in the agent's log three hops down.
#otlp_endpoint = "http://127.0.0.1:4317"

# --- metrics ---------------------------------------------------------------
#
# Where the Prometheus exposition listens. Absent — the default — means
# NOTHING listens, and that is a security decision rather than caution: the
# REST edge is authenticated and tenant-scoped, /metrics is neither, and the
# series behind it name clusters and objects across every tenant. A stock Prometheus
# scrapes it and a stock Grafana draws it; there is no glue in between,
# because every name carries the meister_ prefix, its unit (_seconds, _total)
# and only labels whose value ranges are bounded.
#
# Loopback, because the scraper should be on the box or reach it through
# something that already decides who may ask. One port per PROCESS: an
# all-in-one box runs three of these and they cannot share 9090.
#
# The flag `--metrics-listen` with no value takes 127.0.0.1:9090.
#metrics_listen = "127.0.0.1:9090"

# --- tenants --------------------------------------------------------------
#
# Every tenant gets a VXLAN network identifier when it is created, allocated
# from a counter in this tier's etcd (compare-and-swap, so two API servers
# creating a tenant in the same instant hand out two numbers). The VNI is
# server-set, immutable, and what every node's overlay bridge is named after.
#
# This is only the FLOOR. Ten thousand rather than one so that a lab which
# also runs somebody else's VXLAN deployment does not collide with it at the
# bottom of the range, and so that a number in a `tcpdump` is recognisable as
# ours. Raising it later moves the counter forward on the next allocation
# rather than doing nothing; lowering it does nothing at all, because the
# numbers below have already been handed out.
#
# The practical ceiling is 99999, not the 16777215 a 24-bit VNI allows: a
# node names its bridge `meister-vx<vni>` and a Linux interface name is 15
# characters. Ninety thousand tenants from the default floor.
#vni_base = 10000

# --- routed subnets: the address space a tenant can be given ----------------
#
# The super-pools `meister cloud routedsubnet create` cuts a block out of when
# an admin does not name a CIDR outright. Absent (the default) means every
# subnet has to be named with --cidr, which is the honest default: this
# control plane does not know which prefixes an operator was actually given,
# and inventing one would put somebody else's addresses inside a tenant's
# allowlist.
#
# A routed subnet is the NAT-FREE half of the network story. A tenant that has
# one needs no gateway appliance to be reachable — the addresses inside its
# overlay ARE the addresses outside it — and, as a side effect, its nodes can
# enforce a real source ALLOWLIST on its taps instead of only banning the
# floating pool. A tenant that has none is the hoster mode: whatever private
# space it likes, behind its own NAT appliance, and this control plane never
# learns those addresses.
#
# It may overlap nothing: not another tenant's subnet, and not a floating pool
# — a subnet containing a pool address would put that address on its tenant's
# allowlist and punch a hole in the pool guard the size of the subnet. The
# create refuses with 409 and names what it collided with.
#
# Nothing here is routed by this stack. How a subnet is REACHED is a static
# route towards the hosts, or the tenant's own gateway VM; see the agent
# example. Per-host BGP announcement is deliberately NOT it — a subnet spans
# hosts, so every node announcing it would be every node claiming the whole
# prefix.
#routed_pools = ["10.7.0.0/16"]

# --- placement --------------------------------------------------------------
#
# Which strategy binds an unbound VM to a CLUSTER — the same trait and the
# same TOML spelling the cluster tier uses to bind one to a node, because the
# decision has the same shape both times. One value today, "first-fit", which
# is what this controller was wired to outright before it was a choice, so a
# file that says nothing gets exactly the placement it always had. An unknown
# name is refused at start-up rather than silently defaulted.
#scheduler = "first-fit"

# --- floating pools are OBJECTS, not config ---------------------------------
#
# There is no key here for them on purpose. A pool is created with
#
#   meister cloud floatingpool create lab --cidr 10.255.0.0/16 --default
#   meister cloud floatingpool create public --cidr 203.0.113.7 \
#       --cidr 203.0.113.16-203.0.113.19 --public
#
# — MetalLB's shape, and for MetalLB's reason: a second cloud replica reads
# the same pools out of the same etcd, and an operator adds addresses with the
# same verb they add everything else with. The quota is where the assignment
# rule lives: four addresses out of a private pool without anybody being
# asked, ZERO out of a public one, and
#
#   meister cloud floatingpool quota public acme 2
#
# is the one explicit act that hands out a routable address.
#
# The NODES need the same ranges in their own `guarded_ranges` — deliberate
# duplication, documented in the agent example.

# --- tls, identity and the CA ----------------------------------------------
#
# Every key below is a PATH to a PEM file and never PEM. A key that can be
# pasted into a TOML file is a key that ends up in a git history. Relative
# paths resolve against THIS file, so a config and its pki/ directory travel
# as one unit — which is exactly what `tools/meister-ca` produces.
#
# All of it is off by default: with none of these set the cloud-controller
# serves plain http on :3000 and plain gRPC on :50050, every request is
# anonymous and may do anything, and that is the shape the lab has run in
# since M1.

# The serving certificate, used by BOTH ports. Set both or neither — a
# certificate without its key is an error rather than a quiet downgrade to
# plain, because that is the mistake that leaves an API server open while its
# operator believes otherwise.
#tls_cert = "pki/meister-cloud.crt"
#tls_key = "pki/meister-cloud.key"

# The CA that client certificates must chain to. Setting it does two things
# at once: both ports start ASKING for a client certificate, and the mTLS
# authenticator joins the chain below. Asking rather than requiring is
# deliberate — a caller with no certificate has to get far enough to be told
# 401 in words, and `meister login` is by definition such a caller.
#client_ca = "pki/ca.crt"

# The CA this controller SIGNS certificate requests with. Usually the same
# file as client_ca, because it is the same CA; named separately because a
# deployment may verify against a bundle and sign with one of them. Without
# these two the certificatesigningrequests resource still records requests
# and approving one answers 501.
#ca_cert = "pki/ca.crt"
#ca_key = "pki/ca.key"

# How long an issued client certificate lives (default 90).
#cert_ttl_days = 90

# Sign every request the moment it arrives, with no human in the loop. The
# lab switch, and exactly as dangerous as it sounds: with it on, the only
# thing between a caller and a certificate is the authenticator chain — which
# is why a non-admin can only ever ask for its own name. Off by default;
# an administrator otherwise runs `meister cloud csr approve <name>`.
#csr_auto_approve = true

# The authenticator chain, in order. Order is the security-relevant part and
# that is why it is spelled out rather than inferred: the chain stops at the
# first hard no, so what comes FIRST decides what a request carrying two
# credentials is judged as. Omit the key and you get exactly this order,
# with each link contributing only if it has what it needs — so an [auth]
# table that configures nothing is still the anonymous mode.
# --- admission: does the machine actually have room ------------------------
#
# Until this existed the scheduler filtered on connected and schedulable and
# then placed, without ever asking whether the cluster could carry the VM. So
# `schedulable` was half a truth: the cluster was placeable until it OOMed. In
# the lab, three clusters with the same catalogue took EVERY overlay vm onto
# whichever sorted first.
#
# What is free is derived per pass and never stored: the reported capacity,
# times the factors below, minus everything already bound there — Pending vms
# included, because a vm that is bound and not yet started is a claim.
#
# The verdict is made at the BINDING and not at the API edge, and the reason
# is arithmetic rather than taste: at the edge the objects that would have to
# be counted do not exist yet, so two creates in one breath would both be told
# there is space. A pass places one after another and spends as it goes.
#
# The two factors are asymmetric on purpose. Overcommitting MEMORY means the
# OOM killer picks a vm and ends it; overcommitting vCPU means the guests wait
# for each other. One is a lost vm, the other is a slow one. So memory is 1.0
# and this control plane refuses to start with anything above it, while vcpu
# defaults to 4.0 — the one number here that is a judgement rather than a
# derivation. A fleet that was relying on the unlimited placement this stack
# had before admission existed raises it.
#
# A vm that fits nowhere stays Pending with `no candidate has room for N vcpu
# and M MiB` on the object, and shows up in
# meister_scheduler_pending_vms{reason="no-capacity"}.
[admission]
#vcpu = 4.0
#memory = 1.0

[auth]
#chain = ["mtls", "oidc", "bearer"]

# The development bearer token: one static string, no expiry, no rotation,
# read from a file at start-up. It exists because the CSR flow has a
# bootstrap problem — the first request a new user makes is the one asking
# for the certificate they do not have yet — and because a lab wants a way in
# that does not involve a CA. Treat a leak as permanent.
#bearer_token_file = "pki/dev-token"
#bearer_identity = "dev-admin"
# Break glass by default: `system:masters` is above the user directory and
# answers to no User object, which is what the bootstrap needs — until the
# first user exists there is no directory entry for an ordinary admin.
#bearer_groups = ["system:masters"]

# --- the identity provider -------------------------------------------------
#
# Certificates are for things that have no browser, OIDC is for people, and
# not mixing those two is the decision this whole section rests on. Nodes and
# clusters authenticate with mTLS and always will; `system:node:<name>` comes
# out of a certificate this stack's own CA issued, and no token is ever
# allowed to name one.
#
# Cloud only. The cluster tier keeps no user directory, and without one a
# token authenticates somebody it could then permit nothing — so a
# [auth.oidc] table there is a start-up error rather than a quiet no-op.
#
# What a token settles is WHO. What somebody may do stays the directory's
# answer: the role is read off the User object on every request, so a
# demotion there takes effect at once, and no claim in any token becomes a
# role or a permission. A token for a name the directory does not know is
# therefore worth nothing — the same answer somebody whose account was
# deleted gets.
#
# The order in `chain` matters more here than anywhere else. Both bearer
# links read the same Authorization header and the chain stops at the first
# hard no, so "bearer" in front of "oidc" makes the oidc link unreachable.
# That configuration is refused at start-up rather than accepted quietly.
#[auth.oidc]
# The issuer, exactly as the provider spells it. `.well-known/
# openid-configuration` is appended to it, and the document that comes back
# has to name this same string or its keys are not taken — a document that
# disowns its issuer gets to choose our signing keys otherwise.
#issuer = "https://idp.example.org/realms/lab"
#client_id = "meisterstack"
# Which audiences a token may carry. Defaults to [client_id]. A token issued
# for Grafana is not a token for this API, however impeccably it is signed.
#audience = ["meisterstack"]
# Which claim is the username. Default `sub`, and that default is a decision:
# `sub` is the one claim OIDC requires to be stable and never reassigned,
# while `email` changes when somebody marries or moves team — and a name that
# changes silently detaches a person from everything they own here, or worse,
# attaches them to what the last holder of that address owned.
#username_claim = "sub"
# The algorithm pin. What the provider ADVERTISES is not what we accept:
# without this list an attacker chooses the algorithm their token is checked
# under. Asymmetric only — there is no symmetric code path in this stack to
# confuse a public key into being an HMAC secret with.
#allowed_algorithms = ["RS256", "ES256"]
# Clock drift on exp and nbf, seconds.
#leeway_secs = 60
# The floor between two key fetches asked for by a request that met an
# unknown key id. This is a rate limit and not a tuning knob: without it a
# token carrying a random `kid` is one request to the provider, and tokens
# are free to make.
#min_refetch_interval_secs = 60
# And how often to refetch with nobody asking, so a key rotation is usually
# picked up before any request meets an unknown key at all.
#refresh_interval_secs = 3600
# The CA that signed the provider, for a provider that is not on the public
# internet. Absent = the platform's own roots, which is right for a real
# provider and wrong for a lab one.
#ca_cert = "pki/idp-ca.crt"
#
# Create a User for somebody the provider knows and the directory does not.
#
# Switched on, this means that everybody the identity provider knows has a
# foot in the door.
#
# Off by default, and that default is the recommendation: with it on, the
# directory stops being a list an administrator wrote. Three things bound it
# and none is decoration — the role is always `member` and is never read from
# a claim, the tenant comes from the claim below and has no default, and that
# tenant has to exist already. So what a stranger gets a foot into is a room
# an administrator has built and named.
#provision_unknown_users = false
#tenant_claim = "meister_tenant"
